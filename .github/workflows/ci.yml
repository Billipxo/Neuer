name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung und Unit-Tests
        run: |
          npx tsc -b
          npm test
      - name: Produktions-Build
        run: npm run build
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Oberflächen-Tests (Demo-Modus)
        run: npm run test:e2e
