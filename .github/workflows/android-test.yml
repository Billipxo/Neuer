# Baut die Android-App und testet sie in einem Android-Emulator (siehe android/test/emulator-test.mjs).
# Die Ergebnisse (Protokoll und Bildschirmfotos) liegen danach als Artefakt „android-test“ beim Lauf.
name: Android-App testen

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: |
          npm ci
          npm install --no-save playwright@1.56.1

      - name: Bauwerkzeuge (Ubuntu-Pakete, wie in android/baue-apk.sh beschrieben)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt zipalign apksigner dalvik-exchange

      - name: Test-App bauen
        run: android/baue-apk.sh --test

      - name: Hardware-Beschleunigung für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Android-Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node android/test/emulator-test.mjs

      - name: Ergebnisse aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: android/build/test-ergebnis/
          if-no-files-found: warn
