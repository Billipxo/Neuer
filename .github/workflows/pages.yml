name: GitHub Pages

# Veröffentlicht das Spiel als Webseite. Läuft bei Pushes auf main oder manuell
# (Actions → GitHub Pages → Run workflow). Voraussetzung: Settings → Pages → Source: „GitHub Actions“.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html css js icons sw.js manifest.webmanifest icon.svg _site/
          # Das ganze Spiel zusätzlich als eine Datei zum Herunterladen (offline am PC)
          python3 tools/build_single.py
          cp dist/arena-der-verdammten.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
