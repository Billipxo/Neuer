<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Teller</title>
    <meta name="description" content="Kalorien im Blick, ausgewogen essen, Wochen planen und einkaufen." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Teller" />
    <script>
      try {
        var t = localStorage.getItem('teller-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1411');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Startet die App nicht (Fehler beim Laden oder Ausführen), steht hier eine Meldung statt einer leeren Seite.
      // Sobald die App etwas anzeigt, greift das nicht mehr.
      (function () {
        function show(message) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div role="alert" style="max-width:32rem;margin:15vh auto 0;padding:1.5rem;font:16px/1.5 system-ui,sans-serif">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .5rem">Teller konnte nicht starten</h1>' +
            '<p style="margin:0 0 .75rem">Bitte die Seite neu laden. Bleibt es dabei, hilft diese Meldung bei der Suche nach der Ursache:</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;margin:0;padding:.75rem;border-radius:.75rem;background:rgba(127,127,127,.15);font-size:.875rem"></pre></div>';
          root.querySelector('pre').textContent = message;
        }
        window.addEventListener('error', function (e) {
          show(e.message || 'Eine Datei der App konnte nicht geladen werden.');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show(String((e.reason && e.reason.message) || e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
