<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Arena der Verdammten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120e16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
/* Layout: one full-screen canvas arena; menus are parchment-and-iron panels layered on top. */
:root{
  --night:#120e16;      /* page / void */
  --stone:#221b28;      /* panel ground */
  --stone-2:#2e2535;    /* raised panel */
  --iron:#4a3f52;       /* borders */
  --parch:#efe2c4;      /* main text */
  --parch-dim:#b7a88c;  /* secondary text */
  --gold:#e6b450;       /* accent: gold & highlights */
  --blood:#c8423a;      /* danger / HP */
  --soul:#8fd3ff;       /* soul currency */
  --c-common:#b9b2a6; --c-rare:#5aa9ff; --c-epic:#c77dff;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--parch);font-family:var(--f-body);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.hudtop{display:flex;gap:10px;align-items:flex-start}
.hpwrap{flex:1;max-width:260px;display:flex;flex-direction:column;gap:5px}
.hpbar{position:relative;height:20px;background:#00000080;border:2px solid var(--iron);border-radius:4px;overflow:hidden}
#hpFill{position:absolute;inset:0;width:100%;background:linear-gradient(#e2564d,#8f2620);transition:width .15s}
#hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hudline{display:flex;gap:12px;font-size:14px;font-weight:700;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hudline .g{color:var(--gold)} .hudline .s{color:var(--soul)}
#hudRoom{margin-left:auto;text-align:right;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--parch-dim);text-shadow:0 1px 2px #000;padding-top:4px}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:8px;border:2px solid var(--iron);background:#000a;font-size:18px;flex:none}
#bossBar{margin:10px auto 0;max-width:420px;text-align:center}
#bossBar .name{font-family:var(--f-display);font-weight:800;color:var(--gold);letter-spacing:.08em;font-size:14px;text-shadow:0 1px 3px #000}
#bossBar .bar{height:10px;margin-top:4px;background:#000a;border:1px solid var(--iron);border-radius:3px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#7d1e9a,#d0453c)}
#skillBtn{pointer-events:auto;position:absolute;
  right:calc(max(16px, env(safe-area-inset-right,0px)) + 8px);
  bottom:calc(28px + env(safe-area-inset-bottom,0px));
  width:82px;height:82px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 40% 35%,#4a3a55,#1a1320);
  font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #e6b45055;touch-action:none}
#skillBtn .cd,#dashBtn .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#000c calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
#skillBtn.ready{animation:pulse 1.6s infinite}
#skillBtn .lbl,#dashBtn .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--f-display);white-space:nowrap;color:var(--parch-dim);text-shadow:0 1px 2px #000}
@keyframes pulse{50%{box-shadow:0 0 30px #e6b450aa}}
.hint{animation:hintPulse .9s infinite!important}
@keyframes hintPulse{50%{transform:scale(1.14);box-shadow:0 0 0 10px #8fd3ff55,0 0 30px #8fd3ff}}
#dashBtn{pointer-events:auto;position:absolute;
  right:calc(max(16px, env(safe-area-inset-right,0px)) + 108px);
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:50%;border:3px solid var(--soul);background:radial-gradient(circle at 40% 35%,#2c3b52,#121822);
  font-size:26px;display:flex;align-items:center;justify-content:center;touch-action:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;border:2px solid var(--iron);border-radius:8px;background:var(--stone);font-size:16px;text-align:left}
.toggle .sw{flex:none;width:46px;height:26px;border-radius:99px;background:#0008;border:1px solid var(--iron);position:relative}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--parch-dim);transition:left .15s}
.toggle.on .sw{background:#6b4a1c;border-color:var(--gold)}
.toggle.on .sw::after{left:23px;background:var(--gold)}
.btn.danger{border-color:var(--blood);color:#ffb3ad}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,46px);color:var(--gold);
  text-shadow:0 3px 0 #000,0 0 24px #000;opacity:0;transition:opacity .3s;letter-spacing:.04em;padding:0 16px}
#banner.show{opacity:1}
#banner small{display:block;font-size:.42em;color:var(--parch);letter-spacing:.12em;margin-top:6px}

/* ---------- Screens ---------- */
#ui{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 0%,#2a1f31b0 0%,#120e16c0 70%);
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
#ui.dim{background:#0c0910d9}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.03em}
h1{font-size:clamp(30px,9vw,46px);font-weight:800;line-height:1.05;color:var(--gold);text-shadow:0 3px 0 #000,0 0 30px #e6b45033}
h2{font-size:24px;color:var(--gold)}
h3{font-size:16px}
.sub{color:var(--parch-dim);font-size:15px;line-height:1.45;margin:0}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;font-size:17px;font-weight:700;
  border:2px solid var(--iron);border-radius:6px;background:linear-gradient(var(--stone-2),var(--stone));box-shadow:inset 0 1px 0 #ffffff14,0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff14,0 1px 0 #000}
.btn.primary{border-color:var(--gold);background:linear-gradient(#6b4a1c,#3e2a10);color:#fff3d6}
.btn.small{padding:9px 12px;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#0007;border:1px solid var(--iron);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.g{color:var(--gold)} .pill.s{color:var(--soul)} .pill.h{color:#ff8a80}
.title-block{text-align:center;padding-top:6vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.crest{width:120px;height:120px}
.menu-btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.foot{margin-top:auto;text-align:center;color:var(--parch-dim);font-size:13px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--parch-dim);text-decoration:underline;font-size:13px;padding:6px}

.card{position:relative;border:2px solid var(--iron);border-radius:8px;background:linear-gradient(170deg,var(--stone-2),var(--stone));padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.card .ic{font-size:30px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#0006}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .nm{font-family:var(--f-display);font-weight:800;font-size:16px}
.card .ds{color:var(--parch-dim);font-size:14px;line-height:1.35}
.card .pv{font-size:12.5px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.card .syn{font-size:12.5px;color:var(--c-epic);font-weight:700}
.card .rar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.card.common{border-color:#6f675e} .card.common .rar{color:var(--c-common)}
.card.rare{border-color:var(--c-rare);box-shadow:0 0 14px #5aa9ff33} .card.rare .rar{color:var(--c-rare)}
.card.epic{border-color:var(--c-epic);box-shadow:0 0 18px #c77dff44} .card.epic .rar{color:var(--c-epic)}
.card.sel{border-color:var(--gold)}
.card .price{margin-left:auto;align-self:center;flex:none}
.card:disabled{opacity:.5}
.cards{display:flex;flex-direction:column;gap:10px}
.reward-card{animation:dealIn .35s backwards}
.reward-card:nth-child(2){animation-delay:.08s}.reward-card:nth-child(3){animation-delay:.16s}.reward-card:nth-child(4){animation-delay:.24s}
@keyframes dealIn{from{transform:translateY(16px) scale(.97);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:12px;color:var(--parch-dim);margin-top:4px;font-variant-numeric:tabular-nums}
.stats b{color:var(--parch);display:block;font-size:14px}
.lvl{display:flex;gap:3px;margin-top:4px}
.lvl i{width:14px;height:6px;border-radius:2px;background:#0008;border:1px solid var(--iron)}
.lvl i.on{background:var(--soul);border-color:var(--soul)}

/* Map */
.mapscreen{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mapbox{position:relative;flex:1;min-height:420px;border:2px solid var(--iron);border-radius:10px;
  background:radial-gradient(ellipse at 50% 40%,#3a2f3a,#1c1620 75%);overflow:hidden}
.mapbox::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 2px,transparent 2px 7px);pointer-events:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:2px solid #6c5d66;background:#2b2230;font-size:22px;
  display:flex;align-items:center;justify-content:center;padding:0;opacity:.55}
.node.boss{width:68px;height:68px;font-size:34px;border-color:#8a2b2b}
.node.avail{opacity:1;border-color:var(--gold);box-shadow:0 0 0 4px #e6b45033,0 0 16px #e6b45088;animation:pulse 1.4s infinite}
.node.done{opacity:.9;background:#1a2a1e;border-color:#4f7a55}
.node.cur{border-color:#fff;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--parch-dim);justify-content:center}
.relics{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.relic{font-size:16px;background:#0006;border:1px solid var(--iron);border-radius:6px;padding:2px 5px;position:relative}
.relic sup{font-size:10px;color:var(--gold);font-weight:700}

.scores{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.scores td,.scores th{padding:8px 6px;border-bottom:1px solid var(--iron);text-align:left;font-size:14px}
.scores th{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;color:var(--parch-dim);text-transform:uppercase}
.scores td.n{text-align:right;color:var(--gold);font-weight:700}
.center{text-align:center}
.bigscore{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.endstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.endstats div{background:#0005;border:1px solid var(--iron);border-radius:6px;padding:10px;display:flex;justify-content:space-between;font-size:14px}
.endstats b{font-variant-numeric:tabular-nums}
.help p{margin:0 0 10px;line-height:1.5;color:var(--parch)}
.help b{color:var(--gold)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hudtop">
    <div class="hpwrap">
      <div class="hpbar"><div id="hpFill"></div><span id="hpText"></span></div>
      <div class="hudline"><span class="g">💰 <span id="hGold">0</span></span><span class="s">👻 <span id="hSouls">0</span></span></div>
    </div>
    <div id="hudRoom"></div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="bossBar" class="hidden"><div class="name" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="banner"></div>
  <button id="dashBtn" aria-label="Ausweichen">💨<div class="cd"></div><span class="lbl">Ausweichen</span></button>
  <button id="skillBtn" aria-label="Fähigkeit"><span id="skillIc"></span><div class="cd"></div><span class="lbl" id="skillLbl"></span></button>
</div>

<div id="ui"></div>

<script>
'use strict';
/* =========================================================
   ARENA DER VERDAMMTEN – ein Fantasy-Roguelike für das Handy
   ========================================================= */

/* ---------------- DATEN ---------------- */
const ACTS = [
  { name:'Die Verliese',    floorA:'#3b3e4a', floorB:'#343744', grout:'#22242c', wall:'#17181e', moss:'#4f6b3a', accent:'#9fb3d9', boss:'golem', pillar:'#5d6170', pillarTop:'#767b8b', dark:'rgba(4,6,14,0.7)', fire:'#ff8a2a', fireCore:'#ffe09a', dust:'#8a8f9a', mote:'#d8d0b8' },
  { name:'Die Krypta',      floorA:'#3c3346', floorB:'#352d3f', grout:'#211b28', wall:'#140f19', moss:'#6a3f8a', accent:'#c49cf0', boss:'lich', pillar:'#4f4559', pillarTop:'#685b75', dark:'rgba(8,4,18,0.76)', fire:'#5affb0', fireCore:'#e0fff4', dust:'#7a6a8a', mote:'#b89aff' },
  { name:'Der Drachenhort', floorA:'#46302d', floorB:'#3d2a27', grout:'#201211', wall:'#140a09', moss:'#d2551f', accent:'#ff9a4a', boss:'dragon', pillar:'#5b3b35', pillarTop:'#77504a', dark:'rgba(16,4,2,0.62)', fire:'#ff5a1a', fireCore:'#ffe09a', dust:'#6a4a40', mote:'#ff9a3a' },
];

const actOf = n => ACTS[(n-1)%3];
const visAct = () => ((run.act-1)%3)+1;
const CHARS = {
  krieger:{ name:'Krieger',  icon:'🛡️', cost:0,   color:'#3f6fc4', hp:150, speed:152, dmg:24, rate:0.7, range:72,  attack:'melee', armor:2,
    desc:'Robuster Nahkämpfer mit Rüstung. Schwingt sein Schwert in weitem Bogen.',
    passive:'Kampfeslust: Jeder Schwerthieb, der trifft, heilt 1 LP. Im Wirbelwind halbierter Schaden.',
    skill:{ name:'Wirbelwind', icon:'🌀', cd:8, desc:'Wirbelt 1,5 Sek. und trifft alles ringsum.' } },
  magier: { name:'Magierin', icon:'🔮', cost:120, color:'#7d48c9', hp:85,  speed:142, dmg:14, rate:0.62, range:300, attack:'bolt',  armor:0,
    desc:'Zielsuchende Arkangeschosse, die beim Aufprall explodieren.',
    skill:{ name:'Frostnova', icon:'❄️', cd:9, desc:'Eisexplosion, die nahe Gegner einfriert.' } },
  jaegerin:{ name:'Jägerin', icon:'🏹', cost:250, color:'#3b8f55', hp:100, speed:172, dmg:12, rate:0.38, range:340, attack:'arrow', armor:0,
    desc:'Schnell und präzise. Ihre Pfeile durchbohren Gegner.',
    skill:{ name:'Pfeilhagel', icon:'🎯', cd:7, desc:'Ein Ring aus Pfeilen in alle Richtungen.' } },
  nekro:  { name:'Nekromantin', icon:'🦴', cost:400, color:'#2a7d6c', hp:90, speed:145, dmg:13, rate:0.72, range:290, attack:'skull', armor:0,
    desc:'Wirft Seelenschädel. Besiegte Gegner erheben sich manchmal als Skelettdiener.',
    skill:{ name:'Totenheer', icon:'⚰️', cd:12, desc:'Beschwört 4 Skelettkrieger für 10 Sek.' } },
};

const ENEMIES = {
  slime:   { name:'Schleim',   hp:22, speed:58,  dmg:8,  r:14, cost:1,   ai:'hop',     gold:1 },
  bat:     { name:'Fledermaus',hp:12, speed:128, dmg:6,  r:10, cost:1,   ai:'bat',     gold:1 },
  skeleton:{ name:'Skelett',   hp:32, speed:74,  dmg:10, r:13, cost:1.5, ai:'chase',   gold:1 },
  archer:  { name:'Goblin',    hp:24, speed:62,  dmg:9,  r:13, cost:2,   ai:'ranged',  gold:2, fire:2.3 },
  orc:     { name:'Ork',       hp:95, speed:48,  dmg:16, r:20, cost:3.5, ai:'charger', gold:3, minRow:2 },
  cultist: { name:'Kultist',   hp:42, speed:55,  dmg:9,  r:14, cost:2.5, ai:'caster',  gold:2, fire:2.6, minAct:2 },
  imp:     { name:'Feuerteufel',hp:34,speed:100, dmg:10, r:12, cost:2.2, ai:'imp',     gold:2, fire:1.8, minAct:3 },
  shield:  { name:'Schildträger',hp:70,speed:52,  dmg:13, r:17, cost:3,   ai:'shield',  gold:3, minRow:3 },
  healer:  { name:'Heiler',    hp:38, speed:58,  dmg:7,  r:13, cost:2.5, ai:'healer',  gold:2, minAct:2 },
  worm:    { name:'Grabwurm',  hp:55, speed:140, dmg:14, r:16, cost:3,   ai:'burrow',  gold:3, minAct:2 },
  mimic:   { name:'Mimic',     hp:170,speed:80,  dmg:18, r:20, cost:99,  ai:'charger', gold:25, noPool:true },
};

const BOSSES = {
  golem: { name:'Der Steingolem', hp:700,  speed:42, dmg:16, r:40 },
  lich:  { name:'Der Lichkönig',  hp:1150, speed:60, dmg:18, r:28 },
  dragon:{ name:'Ignaroth, der Drache', hp:1750, speed:58, dmg:24, r:44 },
};

const RAR = { common:'Gewöhnlich', rare:'Selten', epic:'Episch' };
const UPGRADES = [
  { id:'dmg',   r:'common', ic:'⚔️', nm:'Geschärfte Waffe', ds:'+15 % Schaden',               ap:p=>p.dmg*=1.15 },
  { id:'rate',  r:'common', ic:'🗡️', nm:'Flinke Hände',     ds:'+12 % Angriffstempo',         ap:p=>p.atkSpd*=1.12 },
  { id:'speed', r:'common', ic:'👢', nm:'Windstiefel',      ds:'+10 % Laufgeschwindigkeit',   ap:p=>p.spdMul*=1.10, max:5 },
  { id:'hp',    r:'common', ic:'❤️', nm:'Trollblut',        ds:'+20 max. LP und heilt 20 LP', ap:p=>{p.maxHp+=20;p.hp=Math.min(p.maxHp,p.hp+20);} },
  { id:'armor', r:'common', ic:'🛡️', nm:'Eisenhaut',        ds:'Erlittener Schaden −2',       ap:p=>p.armor+=2, max:5 },
  { id:'regen', r:'common', ic:'🌿', nm:'Heilkräuter',      ds:'Regeneriert 0,6 LP pro Sekunde', ap:p=>p.regen+=0.6 },
  { id:'gold',  r:'common', ic:'💰', nm:'Goldgier',         ds:'+30 % Gold von Gegnern',      ap:p=>p.goldMul+=0.3, max:4 },
  { id:'area',  r:'common', ic:'🎯', nm:'Weite Reichweite', ds:'+15 % Reichweite und Wirkfläche', ap:p=>p.area*=1.15, max:5 },

let RNG=Math.random;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^h>>>16)>>>0; }
function seeded(key,fn){ const old=RNG; RNG=mulberry32(hashStr(key)); try{ return fn(); } finally{ RNG=old; } }
const rand=(a,b)=>a+RNG()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;};
const $=id=>document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function wpick(list){ let t=0; for(const [,w] of list) t+=w; let r=RNG()*t; for(const [v,w] of list){ if((r-=w)<=0) return v; } return list[0][0]; }

let AC=null, lastSfx={};

/* Prozedurale Musik: Bass, Akkordfläche, Arpeggio und Trommeln, je nach Akt und Lage */
const MUS={ next:0, step:0, gain:null, filt:null, noise:null };
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SONGS={ 1:{root:50, prog:[[0,'m'],[-4,'M'],[-2,'M'],[0,'m']]}, 2:{root:45, prog:[[0,'m'],[1,'M'],[0,'m'],[-2,'M']]}, 3:{root:52, prog:[[0,'m'],[-4,'M'],[-2,'M'],[-5,'M']]} };
function musicInit(){
  MUS.gain=AC.createGain(); MUS.gain.gain.value=0; MUS.gain.connect(AC.destination);
  MUS.filt=AC.createBiquadFilter(); MUS.filt.type='lowpass'; MUS.filt.frequency.value=520; MUS.filt.connect(MUS.gain);
  const len=AC.sampleRate*0.2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; MUS.noise=buf;
  MUS.next=AC.currentTime+0.1; setInterval(musicTick,60);
}
function tone(type,f,t,dur,vol,dest,att=0.01){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(dest||MUS.gain); o.start(t); o.stop(t+dur+0.05); }
function drum(t,kind){
  if(kind==='kick'){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(40,t+0.16); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2); o.connect(g); g.connect(MUS.gain); o.start(t); o.stop(t+0.25); }
  else { const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=MUS.noise; f.type='highpass'; f.frequency.value=kind==='hat'?6000:1500;
    g.gain.setValueAtTime(kind==='hat'?0.12:0.35,t); g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='hat'?0.05:0.14)); s.connect(f); f.connect(g); g.connect(MUS.gain); s.start(t); s.stop(t+0.2); }
}
function playStep(step,t,mode,sd){
  const song=SONGS[run?visAct():1], bar=Math.floor(step/16), s=step%16, [off,q]=song.prog[bar%4], root=song.root+off, third=q==='m'?3:4, tones=[0,third,7,12];
  if(s===0){ tone('sawtooth',mtof(root-12),t,sd*16*0.95,0.5,MUS.filt,0.05);
    if(mode==='calm') for(const iv of [0,third,7]) tone('sine',mtof(root+12+iv),t,sd*16,0.12,null,0.6); }
  if(mode==='calm'){ if(s%4===0) tone('triangle',mtof(root+24+tones[(s/4+bar)%4]),t,sd*6,0.16); return; }
  const every=mode==='boss'?1:2;
  if(s%every===0){ const pat=[0,1,2,3,2,1,0,2]; tone('triangle',mtof(root+12+tones[pat[(s/every)%8]]+(mode==='boss'&&s>=8?12:0)),t,sd*1.8,0.2); }
  if(s===0||s===8||(mode==='boss'&&(s===6||s===14))) drum(t,'kick');
  if(s===4||s===12) drum(t,'snare');
  if(mode==='boss'&&s%2===1) drum(t,'hat');
}
function musicTick(){
  if(!AC||!MUS.gain) return;
  const on=save.settings.music && !document.hidden;
  MUS.gain.gain.setTargetAtTime(!on?0:state==='paused'?0.02:0.055, AC.currentTime, 0.4);
  if(!on){ MUS.next=AC.currentTime+0.1; return; }
  const mode=(state==='combat'||state==='paused')&&G?(G.type==='boss'?'boss':'combat'):'calm';
  const sd=60/({calm:66,combat:100,boss:124}[mode])/4;
  if(MUS.next<AC.currentTime) MUS.next=AC.currentTime+0.05;
  while(MUS.next<AC.currentTime+0.25){ playStep(MUS.step,MUS.next,mode,sd); MUS.next+=sd; MUS.step++; }
}
const musicUpdate=()=>{ if(AC) musicTick(); };
function sfx(type){
  if(!save.sound || !AC) return;
  const now=AC.currentTime; if(lastSfx[type] && now-lastSfx[type]<0.05) return; lastSfx[type]=now;
  const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
  const S={ hit:['square',220,90,.05,.06], swing:['triangle',300,120,.06,.08], coin:['sine',900,1500,.05,.07], hurt:['sawtooth',160,50,.1,.22],
    kill:['triangle',180,60,.06,.12], shoot:['sine',600,300,.03,.07], skill:['sawtooth',120,600,.08,.35], boom:['sawtooth',90,30,.12,.3],
    pick:['sine',500,1000,.08,.18], dash:['sine',260,820,.06,.14], boss:['sawtooth',70,40,.12,.8] }[type];
  if(!S) return;
  o.type=S[0]; o.frequency.setValueAtTime(S[1],now); o.frequency.exponentialRampToValueAtTime(S[2],now+S[4]);
  g.gain.setValueAtTime(S[3],now); g.gain.exponentialRampToValueAtTime(0.0001,now+S[4]);
  o.start(now); o.stop(now+S[4]+0.02);
}

/* Boden und Wände werden einmal pro Raum in ein Hintergrundbild gezeichnet */
function buildFloor(){
  const A=actOf(run.act), va=visAct(), k=Math.min(1.6,SCALE*DPR);
  const c=document.createElement('canvas'); c.width=Math.ceil((AW+BORDER*2)*k); c.height=Math.ceil((AH+BORDER*2)*k);
  const g=c.getContext('2d'); g.scale(k,k); g.translate(BORDER,BORDER);
  DECOR={puddles:[],cracks:[],candles:[],runes:[]};
  drawStands(g,A);
  // Wände aus Ziegeln mit Fase
  g.fillStyle=A.wall; g.fillRect(-WALL,-WALL,AW+WALL*2,WALL); g.fillRect(-WALL,AH,AW+WALL*2,WALL); g.fillRect(-WALL,0,WALL,AH); g.fillRect(AW,0,WALL,AH);
  for(let y=-WALL;y<AH+WALL;y+=16) for(let x=-WALL-15;x<AW+WALL;x+=30){
    const bx=x+(Math.floor((y+WALL)/16)%2?15:0);
    if(bx>-2&&bx<AW-26&&y>-2&&y<AH-14) continue;
    g.fillStyle=shade(A.wall,rand(5,20)); g.fillRect(bx+1,y+1,28,14);
    g.fillStyle='rgba(255,255,255,0.06)'; g.fillRect(bx+1,y+1,28,2);
    g.fillStyle='rgba(0,0,0,0.32)'; g.fillRect(bx+1,y+13,28,2);
  }
  const wf=g.createLinearGradient(0,-WALL,0,0); wf.addColorStop(0,'rgba(0,0,0,0.55)'); wf.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=wf; g.fillRect(-WALL,-WALL,AW+WALL*2,WALL);
  // Steinfliesen mit Licht- und Schattenkante
  g.save(); g.beginPath(); g.rect(0,0,AW,AH); g.clip();
  g.fillStyle=A.grout; g.fillRect(0,0,AW,AH);
  const T=48;
  for(let y=0;y<AH;y+=T){ const off=(y/T)%2?T/2:0;
    for(let x=-off;x<AW;x+=T){
      g.fillStyle=shade(RNG()<0.5?A.floorA:A.floorB,rand(-9,9)); g.fillRect(x+2,y+2,T-4,T-4);
      g.fillStyle='rgba(255,255,255,0.07)'; g.fillRect(x+2,y+2,T-4,2); g.fillRect(x+2,y+2,2,T-4);
      g.fillStyle='rgba(0,0,0,0.28)'; g.fillRect(x+2,y+T-4,T-4,2); g.fillRect(x+T-4,y+2,2,T-4);
      const r=RNG();
      if(r<0.08){ g.strokeStyle='rgba(0,0,0,0.45)'; g.lineWidth=1.2; g.beginPath(); let px=x+rand(8,T-8),py=y+4; g.moveTo(px,py);

  ctx.drawImage(lightCv,0,0,W,H);
}

const input={ id:null, ox:0, oy:0, cx:0, cy:0, jx:0, jy:0, keys:{} };
const JR=56;
cvs.addEventListener('pointerdown',e=>{
  audio(); if(state!=='combat') return;
  if(input.id===null){ input.id=e.pointerId; input.ox=input.cx=e.clientX; input.oy=input.cy=e.clientY; input.jx=input.jy=0; try{cvs.setPointerCapture(e.pointerId);}catch(_){} }
  e.preventDefault();
});
cvs.addEventListener('pointermove',e=>{
  if(e.pointerId!==input.id) return;
  input.cx=e.clientX; input.cy=e.clientY;
  let dx=input.cx-input.ox, dy=input.cy-input.oy; const l=Math.hypot(dx,dy);
  if(l>JR){ input.ox+= dx/l*(l-JR); input.oy+= dy/l*(l-JR); dx=input.cx-input.ox; dy=input.cy-input.oy; }
  const m=Math.min(1,Math.hypot(dx,dy)/JR), ll=Math.hypot(dx,dy)||1;
  input.jx=dx/ll*(m<0.12?0:m); input.jy=dy/ll*(m<0.12?0:m);
});
function endPointer(e){ if(e.pointerId===input.id){ input.id=null; input.jx=input.jy=0; } }
cvs.addEventListener('pointerup',endPointer); cvs.addEventListener('pointercancel',endPointer);
addEventListener('keydown',e=>{
  input.keys[e.key.toLowerCase()]=true; audio();

});

function readMove(){
  let x=input.jx, y=input.jy; const k=input.keys;
  if(k['a']||k['arrowleft'])x-=1; if(k['d']||k['arrowright'])x+=1; if(k['w']||k['arrowup'])y-=1; if(k['s']||k['arrowdown'])y+=1;
  const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;} return [x,y];
}

function genMap(act){
  const R=6, rows=[];
  for(let r=0;r<R;r++){
    const n = r===0 ? randi(2,3) : r===R-1 ? randi(2,3) : randi(2,4), row=[];
    for(let i=0;i<n;i++) row.push({ id:act+'_'+r+'_'+i, row:r, x:(i+1)/(n+1)+rand(-0.035,0.035), type:'fight', next:[] });
    rows.push(row);
  }
  for(let r=1;r<R;r++) for(const nd of rows[r]){
    nd.type = r===R-1 ? wpick([['rest',55],['shop',45]]) :
      wpick([['fight',38],['elite',r>=2?17:0],['shop',r>=2?10:5],['rest',r>=2?9:0],['treasure',r>=1?7:0],['event',r>=1?14:0]]);
  }
  if(!rows.slice(1,R-1).some(rw=>rw.some(n=>n.type==='shop'))) pick(rows[3]).type='shop';
  if(!rows.slice(2,R-1).some(rw=>rw.some(n=>n.type==='elite'))) pick(rows[2]).type='elite';
  for(let r=0;r<R-1;r++){
    const a=rows[r], b=rows[r+1];
    a.forEach((nd,i)=>{
      const j = a.length===1 ? 0 : Math.round(i*(b.length-1)/(a.length-1));
      nd.next.push(b[j].id);
      if(RNG()<0.45){ const j2=clamp(j+(RNG()<0.5?-1:1),0,b.length-1); if(!nd.next.includes(b[j2].id)) nd.next.push(b[j2].id); }
    });
    b.forEach((nb,j)=>{ if(!a.some(n=>n.next.includes(nb.id))){ let best=a[0]; for(const n of a) if(Math.abs(n.x-nb.x)<Math.abs(best.x-nb.x)) best=n; best.next.push(nb.id); } });
  }
  const boss={ id:act+'_boss', row:R, x:0.5, type:'boss', next:[] };
  rows[R-1].forEach(n=>n.next.push(boss.id));
  return { rows, boss, R };
}
function allNodes(){ return [...run.map.rows.flat(), run.map.boss]; }
function nodeById(id){ return allNodes().find(n=>n.id===id); }
function availNodes(){ if(!run.posId) return run.map.rows[0].map(n=>n.id); return nodeById(run.posId).next; }

function availUpgrades(){ return UPGRADES.filter(u=>(!u.only||u.only.includes(run.cid)) && (!u.max || (run.upg[u.id]||0)<u.max)); }
function rollUpgrades(n, mode, exclude=[]){
  const L=(run&&run.daily?0:metaLvl('m_luck'))*4;
  const w={ normal:[62-L,30,8+L], elite:[30-L,48,22+L], treasure:[10,52-L,38+L], boss:[0,45,55] }[mode]||[62,30,8];
  const pool=availUpgrades().filter(u=>!exclude.includes(u.id)), out=[];
  for(let i=0;i<n && pool.length;i++){
    let r=wpick([['common',w[0]],['rare',w[1]],['epic',w[2]]]);
    let opts=pool.filter(u=>u.r===r && !out.includes(u)); if(!opts.length) opts=pool.filter(u=>!out.includes(u)); if(!opts.length) break;
    out.push(pick(opts));
  }
  return out;
}

/* ---------------- KAMPF ---------------- */
function enemyPool(act,row){ return Object.keys(ENEMIES).filter(k=>{ const d=ENEMIES[k]; return !d.noPool && (!d.minAct||act>=d.minAct) && (!d.minRow||row>=d.minRow||act>1); }); }
function buildWaves(type){
  const act=run.act, row=nodeById(run.posId).row, depth=(act-1)*6+row;
  const pool=enemyPool(act,row), nW = type==='elite'?2:(row<2?2:3), waves=[];
  for(let w=0;w<nW;w++){
    let budget=(5+depth*1.25+w*1.5)*(type==='elite'?0.7:1)*((runMod()||{}).waveMul||1); const list=[];
    while(budget>0){ const k=pick(pool); list.push({kind:k}); budget-=ENEMIES[k].cost; }
    if(type==='elite' || ((runMod()||{}).eliteEvery && w===nW-1)) list.push({kind:pick(pool.filter(k=>k!=='bat')), elite:true});
    waves.push(list);
  }
  return waves;
}

const FLY={bat:1,imp:1,lich:1,dragon:1};
function genArena(type){
  const obs=[], traps=[], start={x:AW/2,y:AH*0.7}, act=visAct();
  const free=(x,y,r)=> Math.hypot(x-start.x,y-start.y)>r+80 && x>r+24 && x<AW-r-24 && y>r+24 && y<AH-r-24
    && obs.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+34) && traps.every(t=>Math.hypot(t.x-x,t.y-y)>t.r+r+24);
  let pts=[];
  if(type==='boss') pts=[[150,210],[610,210],[150,800],[610,800]];
  else {
    const L=pick(['open','four','ring','corridor','scatter','cross','scatter','four']);
    if(L==='four') pts=[[200,290],[560,290],[200,640],[560,640]];
    if(L==='ring'){ for(let i=0;i<6;i++){ const a=i/6*TAU+0.5; pts.push([AW/2+Math.cos(a)*230,AH*0.45+Math.sin(a)*230]); } }
    if(L==='corridor') pts=[[130,420],[250,420],[510,580],[630,580]];
    if(L==='cross') pts=[[AW/2,250],[AW/2,520],[190,AH/2],[570,AH/2]];
    if(L==='scatter') for(let i=0;i<6;i++) pts.push([rand(90,AW-90),rand(90,AH-90)]);
  }
  for(const [x,y] of pts){ const r=type==='boss'?30:pick([24,28,32]); if(free(x,y,r)) obs.push({type:'pillar',x,y,r}); }
  if(type==='boss'){ if(act===3) for(const x of [120,640]) traps.push({type:'lava',x,y:AH/2,r:48,tick:0}); }
  else {
    if(act===3) for(let i=randi(2,3),k=0;i>0&&k<40;k++){ const r=rand(40,62),x=rand(80,AW-80),y=rand(80,AH-80); if(free(x,y,r)){ traps.push({type:'lava',x,y,r,tick:0}); i--; } }
    else for(let i=randi(1,3),k=0;i>0&&k<40;k++){ const x=rand(80,AW-80),y=rand(80,AH-80); if(free(x,y,30)){ traps.push({type:'spikes',x,y,r:30,t:rand(0,2.8)}); i--; } }
    for(let i=randi(2,4),k=0;i>0&&k<40;k++){ const x=rand(60,AW-60),y=rand(60,AH-60); if(free(x,y,14)){ obs.push({type:'barrel',x,y,r:14}); i--; } }
  }
  traps.forEach((t,i)=>t.id=i);
  return {obs,traps};
}
function solidHit(x,y,r){ for(const o of G.obs) if(!o.dead && Math.hypot(o.x-x,o.y-y)<o.r+r) return o; return null; }
function pushOut(ent, slide=0){
  let hit=false;
  for(const o of G.obs){ if(o.dead) continue; const dx=ent.x-o.x, dy=ent.y-o.y, d=Math.hypot(dx,dy)||0.01, m=ent.r+o.r;
    if(d<m){ ent.x=o.x+dx/d*m; ent.y=o.y+dy/d*m; if(slide){ ent.x+=-dy/d*slide; ent.y+=dx/d*slide; } hit=true; } }
  ent.x=clamp(ent.x,ent.r,AW-ent.r); ent.y=clamp(ent.y,ent.r,AH-ent.r);
  return hit;
}
function los(a,b){
  for(const o of G.obs){ if(o.dead||o.type!=='pillar') continue;
    const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy||1, t=clamp(((o.x-a.x)*dx+(o.y-a.y)*dy)/L,0,1);
    if(Math.hypot(a.x+dx*t-o.x,a.y+dy*t-o.y)<o.r-3) return false; }
  return true;
}

function makeEnemy(kind,x,y,elite){
  const d=ENEMIES[kind], act=run.act, row=nodeById(run.posId).row;
  const ex=act>3?Math.pow(1.25,act-3):1;
  const hs=(1+0.6*(act-1)+0.07*row)*ex, ds=(1+0.3*(act-1)+0.03*row)*Math.sqrt(ex);
  const e={ kind, x,y, r:d.r, hp:d.hp*hs, dmg:d.dmg*ds, speed:d.speed*rand(0.9,1.1), ai:d.ai, t:rand(0,3), seed:rand(0,TAU), flash:0, slow:0, freeze:0, kx:0, ky:0,
    elite:!!elite, gold:d.gold, soul:1, st:0, timer:rand(1,2.5), dir:Math.random()<0.5?1:-1, face:0, orbCd:0, squish:0, fire:d.fire||2 };
  if(elite){ e.hp*=3.2; e.r*=1.35; e.dmg*=1.3; e.gold*=4; e.soul=5; }
  if(kind==='mimic') e.soul=6;
  if(kind==='worm'){ e.under=true; e.timer=rand(1.5,2.5); }
  e.speed*=((runMod()||{}).enemySpeed||1); e.spawnT=0.45;
  e.maxHp=e.hp; return e;
}
function makeBoss(kind,x,y){
  const b=BOSSES[kind], s=(1+0.08*metaLvl('m_dmg'))*(run.act>3?1+0.8*(run.act-3):1);
  const e={ kind, boss:true, x,y, r:b.r, hp:b.hp*s, maxHp:b.hp*s, dmg:b.dmg, speed:b.speed, ai:kind, t:0, flash:0, slow:0, freeze:0, kx:0, ky:0, soul:0, gold:0,
    st:0, timer:2, cast:null, castT:0, face:Math.PI/2, alpha:1, seed:0, orbCd:0, phase2:false, spiral:0 };
  G.boss=e; $('bossName').textContent=b.name; return e;
}

function nextWave(){
  G.waveIdx++; const list=G.waves[G.waveIdx];
  list.forEach((s,i)=>{
    let x,y,tries=0; do{ x=rand(40,AW-40); y=rand(40,AH-40); tries++; }while((Math.hypot(x-P.x,y-P.y)<220 || solidHit(x,y,24) || G.traps.some(t=>t.type==='lava'&&Math.hypot(t.x-x,t.y-y)<t.r+20)) && tries<40);
    G.spawnQ.push({x,y,t:0.9+i*0.12,kind:s.kind,elite:s.elite});
  });
}

function update(dt){
  if(G.slowT>0){ G.slowT-=dt; dt*=0.35; }
  if(G.over){ G.deathT+=dt; dt*=0.3; }
  if(G.whiteFlash>0) G.whiteFlash-=dt;
  G.time+=dt; if(G.tut) updTut(dt);
  // spawns
  for(const s of G.spawnQ){ s.t-=dt; if(s.t<=0){ G.enemies.push(s.boss?makeBoss(s.kind,s.x,s.y):makeEnemy(s.kind,s.x,s.y,s.elite)); burst(s.x,s.y,s.boss?40:10,'#b69cff',s.boss?220:120); } }
  G.spawnQ=G.spawnQ.filter(s=>s.t>0);
  if(!G.cleared && G.type!=='boss' && G.enemies.length===0 && G.spawnQ.length===0){
    if(G.waveIdx < G.waves.length-1){ if(!G.tut || G.tut.step>=(G.waveIdx<0?1:4)) G.waveT-=dt; if(G.waveT<=0){ nextWave(); G.waveT=1.0; if(G.waveIdx>0) banner('Welle '+(G.waveIdx+1)); } }
    else clearRoom();
  }
  if(!G.over) updPlayer(dt);
  for(const e of G.enemies) updEnemy(e,dt);
  separate();
  updAllies(dt);
  updProjectiles(dt);
  updHazards(dt);
  for(const z of G.pzones){ z.life-=dt; z.tick-=dt;
    if(z.tick<=0){ z.tick=0.3; for(const e of G.enemies){ if(!e.dead && Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r) dealDamage(e,z.dps*0.3,{noChain:true,noCrit:true,color:'#c9a0ff'}); } }
    if(Math.random()<dt*3) part(z.x+rand(-10,10),z.y,0,-40,0.5,4,'#9a5aff',true); }
  G.pzones=G.pzones.filter(z=>z.life>0);
  for(const s of G.pstrikes){ s.t+=dt; if(s.t>=s.delay){ s.done=true; explosion(s.x,s.y,s.r,s.dmg,'#8ec8ff'); G.shake+=4; } }
  G.pstrikes=G.pstrikes.filter(s=>!s.done);
  // pending explosions (Explosive Seelen)
  const bl=G.booms; G.booms=[]; for(const b of bl){ explosion(b.x,b.y,b.r,b.dmg,b.barrel?'#ffb03a':'#ff8a3a',true);
    if(b.barrel){ G.shake+=6; for(let i=0;i<10;i++) part(b.x,b.y,rand(-160,160),rand(-160,160),0.6,rand(2,4),'#6b4a2a'); if(Math.hypot(P.x-b.x,P.y-b.y)<b.r+P.r*0.5) hurtPlayer(10+3*run.act,null); } }
  G.obs=G.obs.filter(o=>!o.dead);
  updTraps(dt);
  updAmbient(dt); updWeather(dt); updCrowd(dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updCoins(dt);
  for(const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-p.drag*dt; p.vy*=1-p.drag*dt; p.vy+=p.grav*dt; }
  G.parts=G.parts.filter(p=>p.life>0); if(G.parts.length>450) G.parts.splice(0,G.parts.length-450);
  for(const t of G.texts){ t.t+=dt; t.y-=32*dt; } G.texts=G.texts.filter(t=>t.t<0.8);
  for(const f of G.fx) f.t+=dt; G.fx=G.fx.filter(f=>f.t<f.life);
  G.shake=Math.max(0,G.shake-dt*30); G.hurtFlash=Math.max(0,G.hurtFlash-dt);
  if(G.cleared){ G.clearT+=dt; if((G.clearT>1.5 && G.coins.length===0) || G.clearT>3.5) finishCombat(); }
}

function updPlayer(dt){
  const p=P; const [mx,my]=readMove();
  const sp=p.speed*p.spdMul*(p.spin>0?1.25:1);
  if(p.dashCd>0) p.dashCd-=dt; if(p.dashI>0) p.dashI-=dt;
  if(p.dashT>0){ p.dashT-=dt; const ds=680;
    p.x=clamp(p.x+Math.cos(p.dashA)*ds*dt,p.r,AW-p.r); p.y=clamp(p.y+Math.sin(p.dashA)*ds*dt,p.r,AH-p.r);
    G.fx.push({type:'ghost',x:p.x,y:p.y,t:0,life:0.28,color:CHARS[p.cid].color}); onDashMove(dt); }
  else { p.x=clamp(p.x+mx*sp*dt,p.r,AW-p.r); p.y=clamp(p.y+my*sp*dt,p.r,AH-p.r); }
  pushOut(p);
  p.moving=Math.hypot(mx,my)>0.1; if(p.moving){ p.anim+=dt*11; G.moved+=Math.hypot(mx,my)*sp*dt;
    if(p.dashT<=0){ p.stepT=(p.stepT||0)-dt; if(p.stepT<=0){ p.stepT=0.17; part(p.x+rand(-5,5),p.y+13,rand(-15,15),rand(-18,-4),0.45,2.5,actOf(run.act).dust); } } }
  if(p.inv>0)p.inv-=dt; if(p.swingT>0)p.swingT-=dt; if(p.skillT>0)p.skillT-=dt;
  if(p.regen>0 && p.hp<p.maxHp){ p.hp=Math.min(p.maxHp,p.hp+p.regen*dt); }
  if(p.manaShield && p.shieldLeft<=0){ p.msT+=dt; if(p.msT>=10){ p.msT=0; p.shieldLeft=1; G.fx.push({type:'ring',x:p.x,y:p.y,r:34,t:0,life:0.4,color:'#7fb4ff'}); } }
  const c=CHARS[p.cid];
  const reach = c.attack==='melee' ? p.range*p.area+26 : p.range*(c.attack==='bolt'?1:1)*Math.sqrt(p.area);
  const tgt=nearestEnemy(p, reach, null, c.attack!=='melee');
  if(tgt) p.face=angTo(p,tgt); else if(p.moving) p.face=Math.atan2(my,mx);
  p.atkT-=dt;
  if(p.atkT<=0 && tgt && p.spin<=0){ attack(tgt); p.atkT=p.rate/p.atkSpd/(p.rage&&p.hp<p.maxHp*0.5?1.4:1); }
  // Wirbelwind
  if(p.spin>0){ p.spin-=dt; p.spinTick-=dt; p.face+=dt*18;
    if(p.spinTick<=0){ p.spinTick=0.16; const R=95*p.area; sfx('swing');
      for(const e of G.enemies){ if(Math.hypot(e.x-p.x,e.y-p.y)<R+e.r) dealDamage(e,p.dmg*0.65,{kb:140,from:p}); }
      G.fx.push({type:'ring',x:p.x,y:p.y,r:R,t:0,life:0.2,color:'#cfe3ff'}); } }
  // Feuerkugeln
  if(p.orbit>0){ G.orbitA+=dt*3.2; const R=62*Math.sqrt(p.area);
    for(let i=0;i<p.orbit;i++){ const a=G.orbitA+i*TAU/p.orbit, ox=p.x+Math.cos(a)*R, oy=p.y+Math.sin(a)*R;
      if(Math.random()<0.5) part(ox,oy,rand(-20,20),rand(-20,20),0.3,3,'#ff9a3a',true);
      for(const e of G.enemies){ if(e.orbCd<=0 && Math.hypot(e.x-ox,e.y-oy)<e.r+11){ e.orbCd=0.45; dealDamage(e,p.dmg*0.55,{kb:60,from:{x:ox,y:oy}}); if(hasSyn('inferno')) G.booms.push({x:ox,y:oy,r:44,dmg:p.dmg*0.45}); } } } }
}
function nearestEnemy(from,maxD,exclude,needLos){
  let best=null,bd=maxD;
  for(const e of G.enemies){ if(e.dead||e===exclude||(e.alpha!==undefined&&e.alpha<0.3)||e.under) continue; if(needLos && !los(from,e)) continue; const d=Math.hypot(e.x-from.x,e.y-from.y)-e.r; if(d<bd){bd=d;best=e;} }
  return best;
}

function attack(tgt){
  const p=P, c=CHARS[p.cid], a=angTo(p,tgt);
  p.atkCount++;
  if(c.attack==='melee'){
    const R=p.range*p.area+12, arc=2.2; p.swingT=0.18; sfx('swing');
    for(let i=0;i<p.count;i++){
      const ang=a+i*TAU/p.count;
      let hitAny=false;
      for(const e of G.enemies){ const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<R+e.r && !e.under && Math.abs(angDiff(Math.atan2(e.y-p.y,e.x-p.x),ang))<arc/2+0.2){ dealDamage(e,p.dmg,{kb:170,from:p}); hitAny=true; } }
      if(hitAny && p.hp<p.maxHp) p.hp=Math.min(p.maxHp,p.hp+1);
      for(const o of G.obs){ if(o.type==='barrel' && Math.hypot(o.x-p.x,o.y-p.y)<R+o.r && Math.abs(angDiff(Math.atan2(o.y-p.y,o.x-p.x),ang))<arc/2+0.2) blowBarrel(o); }
      G.fx.push({type:'slash',x:p.x,y:p.y,a:ang,r:R,t:0,life:0.2,arc});
      if(p.wave>0) G.pproj.push({type:'wave',x:p.x+Math.cos(ang)*20,y:p.y+Math.sin(ang)*20,vx:Math.cos(ang)*430,vy:Math.sin(ang)*430,r:16*p.area,dmg:p.dmg*(0.3+0.15*p.wave),life:0.5,pierce:99,hit:new Set()});
    }
  } else if(c.attack==='bolt'){
    sfx('shoot');
    for(let i=0;i<p.count;i++){ const ang=a+(i-(p.count-1)/2)*0.32;
      G.pproj.push({type:'bolt',x:p.x+Math.cos(ang)*14,y:p.y+Math.sin(ang)*14-6,vx:Math.cos(ang)*360,vy:Math.sin(ang)*360,sp:360,r:7,dmg:p.dmg,life:1.6,target:tgt,aoe:34*p.area,pierce:0,split:p.split,hit:new Set()}); }
    if(p.meteor && p.atkCount%6===0) G.pstrikes.push({x:tgt.x,y:tgt.y,t:0,delay:0.55,r:80*p.area,dmg:p.dmg*3});
  } else if(c.attack==='skull'){
    sfx('shoot');
    for(let i=0;i<p.count;i++){ const ang=a+(i-(p.count-1)/2)*0.3;
      G.pproj.push({type:'skull',x:p.x+Math.cos(ang)*12,y:p.y-6,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300,sp:300,r:8,dmg:p.dmg,life:1.5,target:tgt,pierce:0,hit:new Set()}); }
  } else {
    sfx('shoot');
    for(let i=0;i<p.count;i++){ const ang=a+(i-(p.count-1)/2)*0.14;
      G.pproj.push({type:'arrow',x:p.x,y:p.y-4,vx:Math.cos(ang)*640,vy:Math.sin(ang)*640,r:5,dmg:p.dmg,life:0.75*Math.sqrt(p.area)+0.25*p.bounce,pierce:p.pierce,bounce:p.bounce,poison:p.poison,hit:new Set()}); }
    if(p.volley && p.atkCount%4===0) for(let i=-2;i<=2;i++){ const ang=a+i*0.22; G.pproj.push({type:'arrow',x:p.x,y:p.y-4,vx:Math.cos(ang)*600,vy:Math.sin(ang)*600,r:5,dmg:p.dmg*0.8,life:0.7,pierce:p.pierce,bounce:p.bounce,poison:p.poison,hit:new Set(),gold:true}); }
  }
}

function useDash(){
  if(state!=='combat'||!P||!G||P.dashCd>0||P.dashT>0||G.over) return;
  const [mx,my]=readMove();
  P.dashA = Math.hypot(mx,my)>0.2 ? Math.atan2(my,mx) : P.face;
  G.tutDash=true; P.dashT=0.2; P.dashI=0.32; P.dashCd=1.3*P.dashCdMul; P.dashHit=[];
  if(hasSyn('phantom')) P.nextCrit=true;
  sfx('dash'); burst(P.x,P.y+8,8,'#cfe3ff',90);
}
function onDashMove(dt){
  const p=P;
  if(p.dashDmg>0) for(const e of G.enemies){ if(!e.dead && !p.dashHit.includes(e) && Math.hypot(e.x-p.x,e.y-p.y)<p.r+e.r+8){ p.dashHit.push(e); dealDamage(e,p.dmg*p.dashDmg,{kb:340,from:p}); G.shake+=2; } }
  if(p.shadow>0){ p.trailT-=dt; if(p.trailT<=0){ p.trailT=0.05; G.pzones.push({x:p.x,y:p.y,r:24,life:1.4+0.5*p.shadow,max:1.4+0.5*p.shadow,dps:p.dmg*(0.5+0.3*p.shadow),tick:0}); } }
}
function raiseAlly(x,y,life){

  burst(x,y,14,'#5affd0',140);

function updAllies(dt){
  for(const a of G.allies){
    a.life-=dt; a.t+=dt; a.atkT-=dt;
    let best=null,bd=1e9; for(const e of G.enemies){ if(e.dead||e.under) continue; const d=Math.hypot(e.x-a.x,e.y-a.y)-e.r; if(d<bd){bd=d;best=e;} }
    if(best){ const ang=Math.atan2(best.y-a.y,best.x-a.x); a.face=ang;
      if(bd>a.r+4){ a.x+=Math.cos(ang)*125*dt; a.y+=Math.sin(ang)*125*dt; }
      else if(a.atkT<=0){ a.atkT=0.7; dealDamage(best,P.dmg*0.5*P.minionDmg,{noChain:true,kb:60,from:a}); } }
    else { const d=Math.hypot(P.x-a.x,P.y-a.y); if(d>60){ const ang=Math.atan2(P.y-a.y,P.x-a.x); a.x+=Math.cos(ang)*125*dt; a.y+=Math.sin(ang)*125*dt; } }
    pushOut(a);
  }
  for(const a of G.allies) if(a.life<=0) burst(a.x,a.y,10,'#e8e2d0',100);
  G.allies=G.allies.filter(a=>a.life>0);
}
const TUT_MSG=['Ziehe irgendwo auf dem Bildschirm, um dich zu bewegen.','Dein Held greift automatisch an. Besiege die Schleime!',
  'Tippe 💨 Ausweichen: ein schneller Hechtsprung, bei dem du kurz unverwundbar bist.','Tippe jetzt deine Fähigkeit unten rechts für einen Spezialangriff.','Sehr gut! Besiege die restlichen Gegner.'];
function updTut(dt){
  const T=G.tut; T.t+=dt;
  if(T.step===0 && G.moved>140){ T.step=1; T.t=0; }
  else if(T.step===1 && G.waveIdx>=0 && G.enemies.length===0 && G.spawnQ.length===0){ T.step=2; T.t=0; }
  else if(T.step===2 && G.tutDash){ T.step=3; T.t=0; }
  else if(T.step===3 && G.tutSkill){ T.step=4; T.t=0; }
  $('dashBtn').classList.toggle('hint',T.step===2); $('skillBtn').classList.toggle('hint',T.step===3);
}
function wrapLines(text,maxW){ const words=text.split(' '), lines=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; } if(cur) lines.push(cur); return lines; }
function drawTut(){

  ctx.font='700 16px "Alegreya Sans", sans-serif'; const maxW=Math.min(W-48,380), lines=wrapLines(TUT_MSG[T.step],maxW-28);

  ctx.globalAlpha=a; ctx.fillStyle='rgba(18,14,22,0.88)'; ctx.strokeStyle='#e6b450'; ctx.lineWidth=2;
  ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(W/2-maxW/2,y,maxW,h,10); else ctx.rect(W/2-maxW/2,y,maxW,h); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#efe2c4'; ctx.textAlign='center'; ctx.textBaseline='middle'; lines.forEach((l,i)=>ctx.fillText(l,W/2,y+22+i*22)); ctx.globalAlpha=1;
}
function hitstop(t){ if(!G) return; G.stop=Math.max(G.stop,t); }
function useSkill(){
  if(state!=='combat'||!P||P.skillT>0||G.over) return;
  const p=P, c=CHARS[p.cid]; p.skillT=c.skill.cd*p.cdMul; sfx('skill'); buzz(20); G.tutSkill=true;
  if(p.cid==='krieger'){ p.spin=1.5; p.spinTick=0; }
  else if(p.cid==='nekro'){ for(let i=0;i<4;i++){ const a=i/4*TAU; raiseAlly(p.x+Math.cos(a)*34,p.y+Math.sin(a)*34,10); } G.fx.push({type:'ring',x:p.x,y:p.y,r:70,t:0,life:0.4,color:'#5affd0',fill:true}); }
  else if(p.cid==='magier'){ const R=170*p.area;
    for(const e of G.enemies){ if(Math.hypot(e.x-p.x,e.y-p.y)<R+e.r){ dealDamage(e,p.dmg*2.2,{from:p,kb:120}); e.freeze=e.boss?0.7:2.4; } }
    G.fx.push({type:'ring',x:p.x,y:p.y,r:R,t:0,life:0.45,color:'#9fe6ff',fill:true}); burst(p.x,p.y,40,'#bdf2ff',320); G.shake+=5;
  } else { const n=24;
    for(let i=0;i<n;i++){ const a=i/n*TAU; G.pproj.push({type:'arrow',x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:5,dmg:p.dmg*1.6,life:0.9,pierce:3,bounce:p.bounce,poison:p.poison,hit:new Set(),gold:true}); }
    G.fx.push({type:'ring',x:p.x,y:p.y,r:60,t:0,life:0.25,color:'#e6ffb0'});
  }
}

function dealDamage(e,amount,o={}){
  if(e.dead||e.under||(e.boss&&e.alpha<0.3)) return;
  let blocked=false;
  if(e.kind==='shield' && o.from){ const ba=Math.atan2(o.from.y-e.y,o.from.x-e.x); if(Math.abs(angDiff(ba,e.face))<1.1){ amount*=0.25; blocked=true; } }
  let crit=!o.noCrit && (P.nextCrit || Math.random()<P.crit); if(crit && P.nextCrit) P.nextCrit=false;
  if(P.rage && P.hp<P.maxHp*0.5) amount*=1.25;
  const d=amount*(crit?P.critMul:1)*rand(0.9,1.1);
  if(o.poison){ e.poisonT=3; e.poisonDps=Math.max(e.poisonDps||0, amount*o.poison/3); }
  if(crit && hasSyn('bladestorm')) P.atkT-=P.rate/P.atkSpd*0.25;
  e.hp-=d; e.flash=e.boss?0.04:0.09; sfx('hit');
  if(o.kb && !e.boss && o.from){ const a=Math.atan2(e.y-o.from.y,e.x-o.from.x), k=o.kb*(e.elite?0.4:1); e.kx+=Math.cos(a)*k; e.ky+=Math.sin(a)*k; }
  G.texts.push({x:e.x+rand(-6,6),y:e.y-e.r-4,s:blocked?'Block':String(Math.round(d)),c:blocked?'#9fb3d9':(o.color||(crit?'#ffd34d':'#ffffff')),big:crit&&!blocked,t:0});
  if(blocked){ burst(e.x+Math.cos(e.face)*e.r,e.y+Math.sin(e.face)*e.r,3,'#ffe08a',90); }
  if(crit && G.stopCd<=0){ hitstop(0.03); G.stopCd=0.25; }
  if(!o.noChain && P.chain>0 && Math.random()<0.12+0.06*P.chain) chainLightning(e, amount*0.7, 2+P.chain);
  if(e.hp<=0) killEnemy(e);
}
function chainLightning(src,dmg,n){
  let cur=src; const hit=new Set([src]);
  for(let i=0;i<n;i++){
    let best=null,bd=170; for(const e of G.enemies){ if(e.dead||hit.has(e)) continue; const d=Math.hypot(e.x-cur.x,e.y-cur.y); if(d<bd){bd=d;best=e;} }
    if(!best) break; G.fx.push({type:'bolt',x:cur.x,y:cur.y,x2:best.x,y2:best.y,t:0,life:0.18}); hit.add(best);
    const nx=best.x, ny=best.y, cold=best.freeze>0||best.slow>0||(P.frost>0&&Math.hypot(P.x-nx,P.y-ny)<110+30*P.frost);
    dealDamage(best,dmg*(cold&&hasSyn('shatter')?2:1),{noChain:true,color:'#bfe6ff'}); cur={x:nx,y:ny};
  }
}
function explosion(x,y,r,dmg,color,fromBoom){
  G.fx.push({type:'ring',x,y,r,t:0,life:0.3,color,fill:true}); burst(x,y,16,color,200); sfx('boom'); G.shake+=2;
  for(const e of G.enemies){ if(!e.dead && Math.hypot(e.x-x,e.y-y)<r+e.r) dealDamage(e,dmg,{noChain:true,kb:120,from:{x,y}}); }
  for(const o of G.obs){ if(o.type==='barrel' && !o.dead && Math.hypot(o.x-x,o.y-y)<r+o.r) blowBarrel(o); }
}
function killEnemy(e){
  e.dead=true; sfx('kill'); if(e.elite) hitstop(0.09); if(e.boss) hitstop(0.35);
  burst(e.x,e.y,e.boss?80:12,enemyColor(e),e.boss?300:160);
  if(e.boss){ hype(1); crowdSound(1.4); G.shake=20; buzz(200); G.slowT=1.4; G.whiteFlash=0.5; for(let i=0;i<60;i++){ const a=rand(0,TAU),s=rand(100,420); part(e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,rand(0.8,1.6),rand(3,6),Math.random()<0.5?'#ffd34d':'#fff3b0',true,120); } for(let i=0;i<40;i++) dropCoin(e.x+rand(-40,40),e.y+rand(-40,40),2); run.souls+=25*run.act; run.bosses++;
    for(const o of G.enemies) if(!o.dead&&!o.boss){ o.dead=true; burst(o.x,o.y,8,enemyColor(o),120); }
    G.eproj=[]; G.hazards=[]; clearRoom(); return; }
  run.kills++; run.souls+=e.soul;
  hype(e.elite?0.35:0.035); if(e.elite){ crowdSound(0.6); crowdThrow(3,false); }
  G.fx.push({type:'corpse',e:Object.assign({},e,{flash:0,hp:e.maxHp,spawnT:0,freeze:0,poisonT:0}),t:0,life:0.42});
  part(e.x,e.y-e.r,rand(-10,10),-55,1,4,'#cfe6ff',true,-15);
  const g=Math.max(1,Math.round(e.gold*rand(0.8,1.3)));
  if(!(runMod()||{}).noGold) for(let i=0;i<Math.min(6,g);i++) dropCoin(e.x,e.y,Math.ceil(g/Math.min(6,g)));
  if(Math.random()<0.035) G.coins.push({x:e.x,y:e.y,vx:rand(-40,40),vy:rand(-60,-20),v:0,heart:true,t:0});
  if(P.lifeOnKill) P.hp=Math.min(P.maxHp,P.hp+P.lifeOnKill);
  if(P.minions && !e.small && e.kind!=='mimic' && G.allies.length<P.minions && Math.random()<P.raise) raiseAlly(e.x,e.y,14);
  if(P.explode>0) G.booms.push({x:e.x,y:e.y,r:48+12*P.explode,dmg:P.dmg*(0.4+0.3*P.explode)});
  if(e.kind==='slime' && !e.small){
    for(let i=0;i<2;i++){ const s=makeEnemy('slime',e.x+rand(-8,8),e.y+rand(-8,8),false); s.small=true; s.spawnT=0; s.r=e.elite?13:9; s.hp=s.maxHp=e.maxHp*0.3; s.dmg*=0.7; s.speed*=1.2; s.gold=0; s.soul=0; s.kx=rand(-120,120); s.ky=rand(-120,120); G.enemies.push(s); }
  }
}
function dropCoin(x,y,v){ G.coins.push({x,y,vx:rand(-120,120),vy:rand(-120,120),v,t:0}); }
function updCoins(dt){
  for(const c of G.coins){
    c.t+=dt; const d=Math.hypot(P.x-c.x,P.y-c.y);
    if((d<90 || G.cleared) && c.t>0.35){ const a=Math.atan2(P.y-c.y,P.x-c.x), s=G.cleared?520:380; c.vx+=(Math.cos(a)*s-c.vx)*dt*8; c.vy+=(Math.sin(a)*s-c.vy)*dt*8; }
    else { c.vx*=1-dt*4; c.vy*=1-dt*4; }
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.x=clamp(c.x,6,AW-6); c.y=clamp(c.y,6,AH-6);
    if(d<P.r+10 && c.t>0.25){ c.done=true;
      if(c.heart){ P.hp=Math.min(P.maxHp,P.hp+15); G.texts.push({x:P.x,y:P.y-24,s:'+15',c:'#7dff8a',t:0}); sfx('pick'); }
      else { const v=Math.max(1,Math.round(c.v*P.goldMul)); run.gold+=v; run.goldTotal+=v; sfx('coin'); } }
  }
  G.coins=G.coins.filter(c=>!c.done);
}

function enemyShoot(e,ang,speed,dmg,kind,r=6){ G.eproj.push({x:e.x+Math.cos(ang)*e.r,y:e.y+Math.sin(ang)*e.r,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,dmg,kind,r,life:4}); }

function updEnemy(e,dt){
  if(e.spawnT>0){ e.spawnT-=dt; e.t+=dt; return; }
  e.t+=dt; if(e.flash>0)e.flash-=dt; if(e.orbCd>0)e.orbCd-=dt;
  if(e.poisonT>0){ e.poisonT-=dt; e.poisonAcc=(e.poisonAcc||0)+e.poisonDps*dt;
    if(e.poisonAcc>=5||e.poisonT<=0){ const pa=e.poisonAcc; e.poisonAcc=0; if(e.poisonT<=0) e.poisonDps=0; dealDamage(e,pa,{noChain:true,noCrit:true,color:'#8dff6a'}); if(e.dead) return; }
    if(Math.random()<dt*6) part(e.x+rand(-0.6,0.6)*e.r,e.y-e.r*0.3,0,-30,0.5,3,'#8dff6a',true); }
  let sm=1; if(e.freeze>0){ e.freeze-=dt; sm=0; } else if(e.slow>0){ e.slow-=dt; sm=0.5; }
  const d=Math.hypot(P.x-e.x,P.y-e.y), a=Math.atan2(P.y-e.y,P.x-e.x);
  if(P.frost>0 && d<110+30*P.frost) sm*=1-Math.min(0.55,0.3*P.frost);
  if(G.over) sm*=0.3;
  let mx=0,my=0;
  if(e.boss){ updBoss(e,dt,sm,d,a); return; }
  if(e.ai!=='shield') e.face=a;
  switch(e.ai){
    case 'chase': mx=Math.cos(a); my=Math.sin(a); break;
    case 'hop': { const ph=(e.t*1.5+e.seed)%1; const k=ph<0.55?Math.sin(ph/0.55*Math.PI)*2:0; e.squish=k; mx=Math.cos(a)*k; my=Math.sin(a)*k; break; }
    case 'bat': { const w=Math.sin(e.t*4+e.seed)*1.1; mx=Math.cos(a+w); my=Math.sin(a+w); break; }
    case 'ranged': case 'caster': case 'imp': {
      const near=e.ai==='caster'?200:e.ai==='imp'?140:170, far=near+90;
      if(d<near){ mx=-Math.cos(a); my=-Math.sin(a); } else if(d>far){ mx=Math.cos(a); my=Math.sin(a); }
      else { mx=Math.cos(a+Math.PI/2)*e.dir*0.7; my=Math.sin(a+Math.PI/2)*e.dir*0.7; if(Math.random()<dt*0.4) e.dir*=-1; }
      if(e.ai==='imp'){ mx+=Math.cos(e.t*5)*0.4; my+=Math.sin(e.t*6)*0.4; }
      e.timer-=dt*sm;
      if(e.timer<=0 && d<460 && los(e,P)){ e.timer=e.fire*rand(0.85,1.2); e.st=0.3;
        if(e.ai==='ranged') enemyShoot(e,a,210,e.dmg,'arrow',5);
        else if(e.ai==='caster'){ for(let i=-1;i<=1;i++) enemyShoot(e,a+i*0.28,150,e.dmg,'orb',7); if(e.elite) for(let i=-1;i<=1;i+=2) enemyShoot(e,a+i*0.56,150,e.dmg,'orb',7); }
        else enemyShoot(e,a,240,e.dmg,'fire',7);
        if(e.elite && e.ai==='ranged'){ enemyShoot(e,a+0.2,210,e.dmg,'arrow',5); enemyShoot(e,a-0.2,210,e.dmg,'arrow',5); } }
      if(e.st>0) e.st-=dt;
      break; }
    case 'shield': { const tr=1.7*dt*sm; e.face+=clamp(angDiff(a,e.face),-tr,tr); mx=Math.cos(e.face)*0.9; my=Math.sin(e.face)*0.9; break; }
    case 'healer': {
      if(d<200){ mx=-Math.cos(a); my=-Math.sin(a); } else if(d>290){ mx=Math.cos(a); my=Math.sin(a); }
      else { mx=Math.cos(a+Math.PI/2)*e.dir*0.6; my=Math.sin(a+Math.PI/2)*e.dir*0.6; if(Math.random()<dt*0.4) e.dir*=-1; }
      e.timer-=dt*sm; if(e.st>0) e.st-=dt;
      if(e.timer<=0){ e.timer=3.2; e.st=0.5;
        for(const o of G.enemies){ if(o.dead||o.boss||o.hp>=o.maxHp||Math.hypot(o.x-e.x,o.y-e.y)>230) continue;
          o.hp=Math.min(o.maxHp,o.hp+o.maxHp*0.2); G.fx.push({type:'beam',x:e.x,y:e.y-10,x2:o.x,y2:o.y,t:0,life:0.4}); G.texts.push({x:o.x,y:o.y-o.r-8,s:'+',c:'#7dff8a',big:true,t:0}); } }
      break; }
    case 'burrow':
      if(e.st===0){ e.under=true; mx=Math.cos(a); my=Math.sin(a); e.timer-=dt*sm;
        if(Math.random()<dt*14) part(e.x+rand(-9,9),e.y+rand(-4,4),rand(-30,30),rand(-50,-10),0.5,3,'#7a5a3a');
        if(e.timer<=0||d<26){ e.st=1; e.timer=0.65; G.hazards.push({type:'circle',x:e.x,y:e.y,r:50,delay:0.65,t:0,dmg:e.dmg*1.2,color:'#a0703a'}); } }
      else if(e.st===1){ e.timer-=dt; if(e.timer<=0){ e.st=2; e.under=false; e.timer=2.8; burst(e.x,e.y,18,'#7a5a3a',190); G.shake+=3; } }
      else { mx=Math.cos(a)*0.3; my=Math.sin(a)*0.3; e.timer-=dt*sm; if(e.timer<=0){ e.st=0; e.under=true; e.timer=rand(2,3); burst(e.x,e.y,12,'#7a5a3a',140); } }
      break;
    case 'charger':
      if(e.st===0){ mx=Math.cos(a); my=Math.sin(a); e.timer-=dt*sm; if(e.timer<=0 && d<320){ e.st=1; e.stT=0.65; e.ca=a; } }
      else if(e.st===1){ e.stT-=dt*sm; e.face=e.ca; if(e.stT<=0){ e.st=2; e.stT=0.5; } }
      else { e.face=e.ca; mx=Math.cos(e.ca)*7.5; my=Math.sin(e.ca)*7.5; e.stT-=dt; if(Math.random()<0.6) part(e.x,e.y+e.r*0.6,rand(-20,20),rand(-20,20),0.4,4,'#8a7a6a');
        if(e.stT<=0||e.x<=e.r||e.x>=AW-e.r||e.y<=e.r||e.y>=AH-e.r){ e.st=0; e.timer=rand(2.8,4.2); } }
      break;
  }
  e.x+=(mx*e.speed*sm+e.kx)*dt; e.y+=(my*e.speed*sm+e.ky)*dt;
  const kd=Math.min(1,dt*9);   e.kx-=e.kx*kd; e.ky-=e.ky*kd;
  e.x=clamp(e.x,e.r,AW-e.r); e.y=clamp(e.y,e.r,AH-e.r);
  if(!FLY[e.kind] && !e.under) pushOut(e,(e.seed>Math.PI?1:-1)*e.speed*sm*dt*0.8);
  if(d<e.r+P.r-2 && sm>0 && !e.under) hurtPlayer(e.dmg,e);
}

function updBoss(e,dt,sm,d,a){
  e.phase2 = e.hp<e.maxHp*0.5;

        if(e.cast==='summon'){ for(let i=0;i<3;i++) G.spawnQ.push({x:clamp(e.x+rand(-120,120),30,AW-30),y:clamp(e.y+rand(-120,120),30,AH-30),t:0.8,kind:'skeleton'}); }
      } }
    else { e.castT+=dt*sm;
      if(e.cast==='rocks' && e.castT>0.5 && !e.fired){ e.fired=true; const n=e.phase2?16:11, o=rand(0,TAU); for(let i=0;i<n;i++) enemyShoot(e,o+i/n*TAU,180,e.dmg*0.6,'rock',10); G.shake+=6; sfx('boom'); }
      if(e.castT>1.2){ e.cast=null; e.fired=false; e.timer=rand(1.6,2.4); } }
  }
  else if(e.ai==='lich'){
    e.face=a;
    if(e.tele){ e.tele-=dt; e.alpha=Math.abs(e.tele-0.4)/0.4; if(e.tele<0.4 && !e.moved){ e.moved=true; let tries=0; do{ e.x=rand(80,AW-80); e.y=rand(80,AH-80); tries++; }while(Math.hypot(e.x-P.x,e.y-P.y)<260&&tries<20); burst(e.x,e.y,20,'#9effc0',160);} if(e.tele<=0){ e.tele=0; e.alpha=1; } }
    else if(!e.cast){
      if(d>200){ mx=Math.cos(a)*0.5; my=Math.sin(a)*0.5; } else { mx=-Math.cos(a)*0.6; my=-Math.sin(a)*0.6; }
      if(e.timer<=0){ e.cast=pick(e.phase2?['spiral','ring','summon','fan','tele','spiral']:['spiral','ring','fan','tele','summon']); e.castT=0; e.shotT=0;
        if(e.cast==='tele'){ e.tele=0.8; e.moved=false; e.cast=null; e.timer=0.9; }
        if(e.cast==='summon'){ for(let i=0;i<(e.phase2?4:3);i++) G.spawnQ.push({x:clamp(e.x+rand(-140,140),30,AW-30),y:clamp(e.y+rand(-140,140),30,AH-30),t:0.8,kind:Math.random()<0.5?'skeleton':'bat'}); }
      } }
    else { e.castT+=dt*sm; e.shotT-=dt*sm;
      if(e.cast==='spiral'){ if(e.shotT<=0){ e.shotT=e.phase2?0.08:0.11; e.spiral+=0.32; const arms=e.phase2?3:2; for(let i=0;i<arms;i++) enemyShoot(e,e.spiral+i*TAU/arms,150,e.dmg*0.55,'soul',7); } if(e.castT>2.6) endCast(e); }
      else if(e.cast==='ring'){ if(e.shotT<=0 && e.castT<1.4){ e.shotT=0.45; const n=20,o=rand(0,TAU); for(let i=0;i<n;i++) enemyShoot(e,o+i/n*TAU,130,e.dmg*0.6,'soul',8); } if(e.castT>1.6) endCast(e); }
      else if(e.cast==='fan'){ if(e.shotT<=0 && e.castT<1.5){ e.shotT=0.5; for(let i=-3;i<=3;i++) enemyShoot(e,a+i*0.16,230,e.dmg*0.6,'soul',7); } if(e.castT>1.7) endCast(e); }

        if(e.cast==='breath'){ e.ca=a; G.hazards.push({type:'cone',x:e.x,y:e.y,a:a,spread:0.55,len:330,delay:0.9,t:0,dmg:e.dmg*1.2,color:'#ff7a2a',owner:e}); }
        if(e.cast==='meteor'){ const n=e.phase2?9:6; for(let i=0;i<n;i++) G.hazards.push({type:'circle',x:clamp(P.x+rand(-160,160),40,AW-40),y:clamp(P.y+rand(-160,160),40,AH-40),r:62,delay:1.0+i*0.12,t:0,dmg:e.dmg,color:'#ff5a2a',meteor:true}); }
        if(e.cast==='swoop'){ e.ca=a; G.hazards.push({type:'line',x:e.x,y:e.y,a:a,len:520,w:e.r*1.6,delay:0.7,t:0,dmg:0,color:'#ff9a4a',visual:true}); }
      } }
    else { e.castT+=dt*sm; e.shotT-=dt*sm;
      if(e.cast==='breath'){ e.face=e.ca; if(e.castT>0.9 && e.castT<1.5){ for(let i=0;i<3;i++){ const aa=e.ca+rand(-0.5,0.5), s=rand(260,420); part(e.x+Math.cos(e.ca)*e.r,e.y+Math.sin(e.ca)*e.r,Math.cos(aa)*s,Math.sin(aa)*s,0.8,rand(5,9),Math.random()<0.5?'#ffb03a':'#ff5a1a',true);} } if(e.castT>1.6) endCast(e); }
      else if(e.cast==='balls'){ if(e.shotT<=0 && e.castT<1.6){ e.shotT=0.4; for(let i=-2;i<=2;i++) enemyShoot(e,a+i*0.22,220,e.dmg*0.6,'fire',9); } if(e.castT>1.8) endCast(e); }
      else if(e.cast==='swoop'){ e.face=e.ca; if(e.castT>0.7 && e.castT<1.25){ mx=Math.cos(e.ca)*9; my=Math.sin(e.ca)*9; if(Math.random()<0.8) part(e.x,e.y,rand(-30,30),rand(-30,30),0.5,6,'#ff8a3a',true); } if(e.castT>1.5) endCast(e); }
      else if(e.castT>1.3) endCast(e);
    }
  }
  e.x+=(mx*e.speed*sm)*dt; e.y+=(my*e.speed*sm)*dt;
  e.x=clamp(e.x,e.r,AW-e.r); e.y=clamp(e.y,e.r,AH-e.r);
  if(!FLY[e.kind]) pushOut(e,e.speed*dt*0.5);
  if(d<e.r+P.r-4 && (e.alpha===undefined||e.alpha>0.5)) hurtPlayer(e.dmg,e);
}
function endCast(e){ e.cast=null; e.timer=rand(1.3,2.2); }

function separate(){
  const E=G.enemies;
  for(let i=0;i<E.length;i++) for(let j=i+1;j<E.length;j++){
    const a=E[i],b=E[j]; if(a.under||b.under) continue; const dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
    if(d2<rr*rr && d2>0.01){ const d=Math.sqrt(d2), o=(rr-d)/2, nx=dx/d, ny=dy/d;
      const wa=a.boss?0:1, wb=b.boss?0:1, s=wa+wb||1;
      a.x-=nx*o*2*wa/s; a.y-=ny*o*2*wa/s; b.x+=nx*o*2*wb/s; b.y+=ny*o*2*wb/s; }
  }
}

function updProjectiles(dt){
  for(const pr of G.pproj){
    pr.life-=dt;
    if(pr.type==='bolt'||pr.type==='skull'){
      if(pr.target && !pr.target.dead && !pr.target.under){ const want=Math.atan2(pr.target.y-pr.y,pr.target.x-pr.x), cur=Math.atan2(pr.vy,pr.vx), na=cur+clamp(angDiff(want,cur),-(pr.type==='bolt'?7:4)*dt,(pr.type==='bolt'?7:4)*dt); pr.vx=Math.cos(na)*pr.sp; pr.vy=Math.sin(na)*pr.sp; }
      else pr.target=nearestEnemy(pr,250);
      if(Math.random()<0.7) part(pr.x,pr.y,rand(-15,15),rand(-15,15),0.3,3,pr.type==='bolt'?'#c58cff':'#5affd0',true);
    }
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
    if(pr.x<0||pr.y<0||pr.x>AW||pr.y>AH){
      if(pr.bounce>0){ pr.bounce--; if(pr.x<0||pr.x>AW) pr.vx=-pr.vx; if(pr.y<0||pr.y>AH) pr.vy=-pr.vy; pr.x=clamp(pr.x,0,AW); pr.y=clamp(pr.y,0,AH); pr.hit.clear(); pr.life=Math.max(pr.life,0.35); burst(pr.x,pr.y,4,'#ffe08a',80); }
      else pr.life=0; }
    if(pr.life<=0) continue;
    { const o=solidHit(pr.x,pr.y,pr.r); if(o){ if(o.type==='barrel') blowBarrel(o);
        if(pr.type!=='wave'){ pr.life=0; burst(pr.x,pr.y,5,pr.type==='bolt'?'#c58cff':'#b8b0a0',90); continue; } } }
    for(const e of G.enemies){
      if(e.dead||e.under||pr.hit.has(e)||(e.alpha!==undefined&&e.alpha<0.3)) continue;
      if(Math.hypot(e.x-pr.x,e.y-pr.y)<e.r+pr.r){
        if(pr.type==='bolt'){ pr.life=0; G.fx.push({type:'ring',x:pr.x,y:pr.y,r:pr.aoe,t:0,life:0.22,color:'#c58cff',fill:true}); burst(pr.x,pr.y,8,'#d9b3ff',140);
          for(const o of G.enemies){ if(!o.dead && Math.hypot(o.x-pr.x,o.y-pr.y)<pr.aoe+o.r) dealDamage(o, o===e?pr.dmg:pr.dmg*0.4,{kb:80,from:pr}); }
          if(pr.split){ const n=2+pr.split, o0=rand(0,TAU); for(let i=0;i<n;i++){ const sa=o0+i/n*TAU; G.pproj.push({type:'spark',x:pr.x,y:pr.y,vx:Math.cos(sa)*380,vy:Math.sin(sa)*380,r:4,dmg:pr.dmg*0.35,life:0.4,pierce:0,hit:new Set([e])}); } }
          break; }
        pr.hit.add(e); dealDamage(e,pr.dmg,{kb:pr.type==='wave'?120:70,from:{x:pr.x-pr.vx,y:pr.y-pr.vy},poison:pr.poison}); pr.pierce--; if(pr.pierce<0){ pr.life=0; break; }
      }
    }
  }
  G.pproj=G.pproj.filter(p=>p.life>0);
  for(const pr of G.eproj){
    pr.life-=dt; pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
    if(pr.kind==='fire' && Math.random()<0.6) part(pr.x,pr.y,rand(-20,20),rand(-20,20),0.35,4,'#ff8a2a',true);
    if(pr.kind==='soul' && Math.random()<0.3) part(pr.x,pr.y,0,0,0.3,3,'#7dffb0',true);
    if(pr.x<-10||pr.y<-10||pr.x>AW+10||pr.y>AH+10) pr.life=0;
    { const o=solidHit(pr.x,pr.y,pr.r*0.6); if(o){ if(o.type==='barrel') blowBarrel(o); pr.life=0; burst(pr.x,pr.y,4,'#b8b0a0',70); continue; } }
    if(Math.hypot(P.x-pr.x,P.y-pr.y)<P.r+pr.r-2 && !G.over){ pr.life=0; hurtPlayer(pr.dmg,null); burst(pr.x,pr.y,6,'#ffffff',90); }
  }
  G.eproj=G.eproj.filter(p=>p.life>0);
}

function updHazards(dt){

    h.t+=dt; if(h.owner && h.type==='cone'){ h.x=h.owner.x; h.y=h.owner.y; }

function updTraps(dt){

    if(t.type==='spikes'){ t.t+=dt; const c=t.t%2.8, cyc=Math.floor(t.t/2.8);

        for(const e of G.enemies){ if(e.boss||FLY[e.kind]||e.dead||e['sp'+t.id]===cyc) continue;
          if(Math.hypot(e.x-t.x,e.y-t.y)<t.r+e.r*0.4){ e['sp'+t.id]=cyc; dealDamage(e,30*sc,{noChain:true,noCrit:true,color:'#ffb35a'}); } } } }

function hurtPlayer(dmg,src){

  const d=Math.max(1,Math.round((dmg-p.armor-(p.boneArmor?G.allies.length:0))*(p.spin>0?0.5:1)));
  hype(-0.06); p.hp-=d; p.inv=0.75; G.shake=Math.min(14,G.shake+7); G.hurtFlash=0.3; sfx('hurt'); buzz(40); hitstop(0.06);
  G.texts.push({x:p.x,y:p.y-26,s:'-'+d,c:'#ff5a4a',big:true,t:0});
  if(src && p.thorns>0 && !src.dead){ dealDamage(src,p.thorns,{noChain:true}); if(hasSyn('vampthorn')) p.hp=Math.min(p.maxHp,p.hp+5); }
  if(p.hp<=0){
    if(p.revive>0){ p.revive--; run.upg.phoenix=Math.max(0,(run.upg.phoenix||1)-1); if(!run.upg.phoenix) delete run.upg.phoenix; p.hp=Math.ceil(p.maxHp*0.5); p.inv=2.5; burst(p.x,p.y,50,'#ffb84a',260); banner('Phönixfeder!','Du erhebst dich erneut'); }
    else { p.hp=0; G.over=true; G.deathT=0; banner('Gefallen'); burst(p.x,p.y,40,'#c8423a',200); buzz(300); setTimeout(()=>{ if(G&&G.over) endRun(!!(run&&run.won)); },1600); }
  }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const A=actOf(run.act);
  ctx.fillStyle=A.wall; ctx.fillRect(0,0,W,H);
  const vw=W/SCALE, vh=H/SCALE, m=WALL+STAND*0.75;
  let cx = vw>=AW+2*m ? AW/2-vw/2 : clamp(P.x-vw/2,-m,AW+m-vw);
  let cy = vh>=AH+2*m ? AH/2-vh/2 : clamp(P.y-vh/2,-m,AH+m-vh);
  if(G.shake>0 && save.settings.shake){ cx+=rand(-G.shake,G.shake)*0.4; cy+=rand(-G.shake,G.shake)*0.4; }
  ctx.save(); ctx.scale(SCALE,SCALE); ctx.translate(-cx,-cy);
  if(!floorCanvas) buildFloor();
  ctx.drawImage(floorCanvas,-BORDER,-BORDER,AW+BORDER*2,AH+BORDER*2);
  drawCrowd(cx,cy,vw,vh);
  drawFloorLife();
  for(const t of G.traps) drawTrap(t);
  // player zones and strikes
  for(const z of G.pzones) drawGlow(z.x,z.y,z.r*1.5,'#6a2aff',Math.min(1,z.life/z.max*1.5)*0.7);
  for(const s of G.pstrikes){ const k=s.t/s.delay; ctx.strokeStyle='rgba(140,200,255,0.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke(); drawGlow(s.x,s.y-(1-k)*260,30,'#8ec8ff',0.4+0.6*k); }
  // hazards
  for(const h of G.hazards) drawHazard(h);
  // spawn markers
  for(const s of G.spawnQ){ const k=1-s.t/(s.boss?1.6:0.9); ctx.strokeStyle='rgba(190,150,255,'+(0.3+0.5*k)+')'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,(s.boss?50:16)*(1.4-k*0.4),0,TAU); ctx.stroke(); drawGlow(s.x,s.y,(s.boss?60:22),'#9a6aff',0.4*k); }
  // coins
  for(const c of G.coins){ const bob=Math.sin(G.time*6+c.x)*1.5;
    if(c.heart){ ctx.font='16px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('❤️',c.x,c.y+bob); continue; }
    drawGlow(c.x,c.y,12,'#ffcc44',0.4); ctx.fillStyle='#e6b450'; ctx.beginPath(); ctx.ellipse(c.x,c.y+bob,4.5*Math.abs(Math.cos(G.time*4+c.x))+1.5,4.5,0,0,TAU); ctx.fill(); ctx.fillStyle='#fff3b0'; ctx.fillRect(c.x-1,c.y+bob-2,2,2); }
  // shadows + entities sorted
  const ents=[...G.enemies, ...G.obs, ...G.allies, P];
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){ if(e===P) drawHero(); else if(e.type==='pillar') drawPillar(e); else if(e.type==='barrel') drawBarrel(e); else if(e.max!==undefined && e.life!==undefined && !e.kind) drawAlly(e); else if(e.boss) drawBoss(e); else drawEnemy(e); }
  for(const f of G.fog) drawGlow(f.x,f.y,f.r,f.thick?'#9a98a8':'#8a7aa8',f.thick?0.2:0.12);
  ctx.restore();
  if(save.settings.fx) renderLights(cx,cy);
  ctx.save(); ctx.scale(SCALE,SCALE); ctx.translate(-cx,-cy);
  drawFlames();
  // orbit
  if(P.orbit>0 && !G.over){ const R=62*Math.sqrt(P.area); for(let i=0;i<P.orbit;i++){ const a=G.orbitA+i*TAU/P.orbit, ox=P.x+Math.cos(a)*R, oy=P.y+Math.sin(a)*R; drawGlow(ox,oy,22,'#ff8a2a',0.8); ctx.fillStyle='#ffe0a0'; ctx.beginPath(); ctx.arc(ox,oy,5,0,TAU); ctx.fill(); } }
  // projectiles
  for(const p of G.pproj) drawPProj(p);
  for(const p of G.eproj) drawEProj(p);
  // fx
  for(const f of G.fx) drawFx(f);
  // particles
  ctx.globalCompositeOperation='lighter';
  for(const p of G.parts) if(p.glow) drawGlow(p.x,p.y,p.size*3*(p.life/p.max+0.3),p.color,Math.min(1,p.life/p.max*1.5));
  for(const m of G.amb){ const tw=0.5+0.5*Math.sin(m.ph*3); drawGlow(m.x,m.y,(visAct()===1?3:5)*m.s,actOf(run.act).mote,(visAct()===1?0.35:0.7)*tw); }

  if(G.over){ ctx.fillStyle=`rgba(10,0,0,${Math.min(0.55,G.deathT*0.5)})`; ctx.fillRect(0,0,W,H); }
  if(G.hurtFlash>0){ ctx.fillStyle=`rgba(200,30,30,${G.hurtFlash*0.6})`; ctx.fillRect(0,0,W,H); }

function drawTrap(t){

    for(let i=0;i<7;i++){ const a=i/7*TAU, rr=i?t.r*0.6:0, x=t.x+Math.cos(a)*rr, y=t.y+Math.sin(a)*rr*0.8;

  else { const pl=Math.sin(G.time*2+t.x)*0.06;

function drawHero(){

  if(p.shieldLeft>0){ ctx.strokeStyle='rgba(127,212,255,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y-2,22+Math.sin(G.time*4),0,TAU); ctx.stroke(); }

      ctx.fillStyle='#dfe6ef'; ctx.beginPath(); ctx.moveTo(13,-3); ctx.lineTo(36,-2); ctx.lineTo(40,0); ctx.lineTo(36,2); ctx.lineTo(13,3); ctx.closePath(); ctx.fill(); ctx.fillStyle='#ffffff88'; ctx.fillRect(14,-1,22,1); }
    else if(c.attack==='skull'){ ctx.fillStyle='#2a2a30'; ctx.fillRect(0,-1.8,30,3.6); drawGlow(33,0,14,'#2affb0',0.8); ctx.fillStyle='#e8f6f0'; ctx.beginPath(); ctx.arc(33,0,5,0,TAU); ctx.fill(); ctx.fillStyle='#0a2a20'; ctx.fillRect(31,-2,1.6,1.6); ctx.fillRect(34,-2,1.6,1.6); }
    else if(c.attack==='bolt'){ ctx.fillStyle='#5a3a22'; ctx.fillRect(0,-1.8,30,3.6); drawGlow(32,0,14,'#c58cff',0.9); ctx.fillStyle='#f0d8ff'; ctx.beginPath(); ctx.arc(32,0,4.5,0,TAU); ctx.fill(); }
    else { ctx.strokeStyle='#7a5230'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(8,0,15,-1.2,1.2); ctx.stroke(); ctx.strokeStyle='#f0e8d0'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(8+Math.cos(-1.2)*15,Math.sin(-1.2)*15); ctx.lineTo(8+Math.cos(1.2)*15,Math.sin(1.2)*15); ctx.stroke(); }
    ctx.restore(); };
  if(up) drawWeapon();
  { const st=p.moving&&!G.over?Math.sin(p.anim):0; ctx.fillStyle='#231c22'; ctx.beginPath(); ctx.ellipse(-5,12+st*2.2,3.6,2.6,0,0,TAU); ctx.ellipse(5,12-st*2.2,3.6,2.6,0,0,TAU); ctx.fill(); }
  // cape / robe
  ctx.fillStyle=c.color; ctx.beginPath(); ctx.moveTo(-11,-6); ctx.quadraticCurveTo(-14,12,-10,13); ctx.lineTo(10,13); ctx.quadraticCurveTo(14,12,11,-6); ctx.closePath(); ctx.fill();
  // body
  if(p.cid==='krieger'){ ctx.fillStyle='#9aa6b8'; ctx.beginPath(); ctx.ellipse(0,3,9.5,10,0,0,TAU); ctx.fill(); ctx.fillStyle='#c9d2de'; ctx.fillRect(-7,-2,14,3); ctx.fillStyle='#6b4a2a'; ctx.fillRect(-9,6,18,3); }
  else if(p.cid==='magier'){ ctx.fillStyle='#5a3290'; ctx.beginPath(); ctx.moveTo(-9,-4); ctx.lineTo(-12,13); ctx.lineTo(12,13); ctx.lineTo(9,-4); ctx.closePath(); ctx.fill(); ctx.fillStyle='#e6b450'; ctx.fillRect(-1,-3,2,15); }
  else if(p.cid==='nekro'){ ctx.fillStyle='#1c2a28'; ctx.beginPath(); ctx.moveTo(-9,-4); ctx.lineTo(-12,13); ctx.lineTo(12,13); ctx.lineTo(9,-4); ctx.closePath(); ctx.fill(); ctx.fillStyle='#5affd0'; ctx.fillRect(-6,4,12,2); ctx.fillStyle='#e8f6f0'; ctx.beginPath(); ctx.arc(0,0,2.5,0,TAU); ctx.fill(); }
  else { ctx.fillStyle='#6b4a2a'; ctx.beginPath(); ctx.ellipse(0,3,9,10,0,0,TAU); ctx.fill(); ctx.fillStyle='#2f6b40'; ctx.fillRect(-9,0,18,4); ctx.fillStyle='#8a6a3a'; ctx.fillRect(4,-6,4,14); }
  // head
  ctx.fillStyle=p.cid==='nekro'?'#d9dcd6':'#f1c9a0'; ctx.beginPath(); ctx.arc(0,-11,8,0,TAU); ctx.fill();

  if(p.cid==='krieger'){ ctx.fillStyle='#b8c2d0'; ctx.beginPath(); ctx.arc(0,-12,8.6,Math.PI,0); ctx.lineTo(8.6,-10); ctx.lineTo(-8.6,-10); ctx.fill(); ctx.fillStyle='#8a94a4'; ctx.fillRect(-1,-21,2,10);
    ctx.fillStyle='#c8423a'; ctx.beginPath(); ctx.moveTo(0,-21); ctx.quadraticCurveTo(-10,-26,-12,-16); ctx.quadraticCurveTo(-6,-20,0,-19); ctx.fill(); }
  else if(p.cid==='magier'){ ctx.fillStyle='#4a2680'; ctx.beginPath(); ctx.ellipse(0,-14,12,3.5,0,0,TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(-8,-15); ctx.quadraticCurveTo(-2,-26,6,-34); ctx.quadraticCurveTo(4,-24,8,-15); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#e6b450'; ctx.beginPath(); ctx.arc(1,-21,1.6,0,TAU); ctx.fill(); ctx.fillStyle='#e8e0f0'; ctx.fillRect(-4,-5,8,4); }

    ctx.beginPath(); ctx.moveTo(-7,-18); ctx.lineTo(0,-26); ctx.lineTo(7,-18); ctx.fill(); if(!up){ ctx.fillStyle='#5affd0'; ctx.fillRect(-3.5+fx*2.5,-12,2,2.5); ctx.fillRect(1.5+fx*2.5,-12,2,2.5); } }

function hpBar(e){ if(e.hp>=e.maxHp) return; const w=e.r*2; ctx.fillStyle='#000a'; ctx.fillRect(e.x-w/2,e.y-e.r-12,w,4); ctx.fillStyle=e.elite?'#e6b450':'#d9483e'; ctx.fillRect(e.x-w/2,e.y-e.r-12,w*Math.max(0,e.hp/e.maxHp),4); }

      ctx.fillStyle=col(tele?'#a05a3a':'#5a7a3a'); ctx.beginPath(); ctx.ellipse(0,2,r,r*0.95,0,0,TAU); ctx.fill();

    ctx.fillStyle=col('#e8e2d0'); ctx.beginPath(); ctx.arc(0,-r*0.45,r*0.42,0,TAU); ctx.fill(); ctx.fillRect(-r*0.25,-r*0.2,r*0.5,r*0.25);

function drawHazard(h){
  const k=Math.min(1,h.t/h.delay);
  ctx.save();
  if(h.type==='circle'){
    ctx.fillStyle='rgba(220,60,40,0.16)'; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(255,120,80,0.7)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,90,50,0.3)'; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*k,0,TAU); ctx.fill();
    if(h.meteor){ const y=h.y-(1-k)*300; drawGlow(h.x,y,26,'#ff7a2a',k); }
  } else if(h.type==='cone'){
    ctx.fillStyle='rgba(255,110,40,'+(0.12+0.2*k)+')'; ctx.beginPath(); ctx.moveTo(h.x,h.y); ctx.arc(h.x,h.y,h.len,h.a-h.spread,h.a+h.spread); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,140,60,0.7)'; ctx.lineWidth=2; ctx.stroke();
  } else if(h.type==='line'){
    ctx.translate(h.x,h.y); ctx.rotate(h.a); ctx.fillStyle='rgba(255,120,60,'+(0.1+0.2*k)+')'; ctx.fillRect(0,-h.w/2,h.len,h.w);
    ctx.strokeStyle='rgba(255,150,80,0.6)'; ctx.setLineDash([10,8]); ctx.lineWidth=2; ctx.strokeRect(0,-h.w/2,h.len,h.w);
  }
  ctx.restore();
}

function drawPProj(p){

    ctx.strokeStyle='#dfeaff'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(-p.r*0.6,0,p.r,-1.1,1.1); ctx.stroke();
    ctx.strokeStyle='#7fb4ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(-p.r*0.9,0,p.r,-0.9,0.9); ctx.stroke(); ctx.lineCap='butt'; ctx.restore(); ctx.globalAlpha=1; return; }
  if(p.type==='spark'){ drawGlow(p.x,p.y,10,'#e0b0ff',1); return; }
  if(p.type==='skull'){ drawGlow(p.x,p.y,18,'#2affb0',0.8); ctx.fillStyle='#e8f6f0'; ctx.beginPath(); ctx.arc(p.x,p.y-1,5.5,0,TAU); ctx.fill(); ctx.fillRect(p.x-3,p.y+2,6,3);

  if(p.type==='bolt'){ drawGlow(p.x,p.y,18,'#b070ff',0.9); ctx.fillStyle='#f4e6ff'; ctx.beginPath(); ctx.arc(p.x,p.y,4.5,0,TAU); ctx.fill(); return; }

  ctx.fillStyle='#c8423a'; ctx.fillRect(-15,-3,4,2); ctx.fillRect(-15,1,4,2); ctx.restore();
}
function drawEProj(p){

  if(p.kind==='rock'){ ctx.fillStyle='#6a6e78'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.fillStyle='#9aa0aa'; ctx.beginPath(); ctx.arc(p.x-2,p.y-2,p.r*0.5,0,TAU); ctx.fill(); return; }

function drawFx(f){
  const k=f.t/f.life;
  if(f.type==='slash'){ const R=f.r*(0.82+0.18*k), a0=f.a-f.arc/2, a1=a0+f.arc*Math.min(1,k*3+0.35);
    ctx.fillStyle=`rgba(225,238,255,${0.5*(1-k)})`; ctx.beginPath(); ctx.arc(f.x,f.y,R,a0,a1); ctx.arc(f.x,f.y,R*0.6,a1,a0,true); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${1-k})`; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(f.x,f.y,R,a0,a1); ctx.stroke();
    ctx.strokeStyle=`rgba(230,180,80,${(1-k)*0.7})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(f.x,f.y,R*0.8,a0+0.2,a1-0.1); ctx.stroke(); ctx.lineCap='butt'; }
  else if(f.type==='skybolt'){ ctx.globalAlpha=1-k; ctx.strokeStyle=f.color; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); let x=f.x+rand(-30,30), y=f.y-560; ctx.moveTo(x,y);
    for(let i=1;i<=8;i++){ x=i<8?f.x+rand(-24,24):f.x; y=f.y-560+i*70; ctx.lineTo(x,y); } ctx.stroke(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.8; ctx.stroke(); ctx.lineCap='butt'; ctx.globalAlpha=1; drawGlow(f.x,f.y,70,f.color,1-k); }
  else if(f.type==='corpse'){ const e=f.e, by=e.y+e.r*0.8; ctx.save(); GA=Math.max(0,1-k); ctx.globalAlpha=GA; ctx.translate(e.x,by); ctx.scale(1+k*0.45,1-k*0.85); ctx.translate(-e.x,-by); drawEnemy(e,true); ctx.restore(); GA=1; ctx.globalAlpha=1; }
  else if(f.type==='ring'){ ctx.strokeStyle=f.color; ctx.globalAlpha=1-k; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(0.4+0.6*k),0,TAU); ctx.stroke();
    if(f.fill){ ctx.fillStyle=f.color; ctx.globalAlpha=(1-k)*0.25; ctx.fill(); } ctx.globalAlpha=1; }
  else if(f.type==='beam'){ ctx.strokeStyle=`rgba(125,255,138,${1-k})`; ctx.lineWidth=4*(1-k)+1; ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x2,f.y2); ctx.stroke(); drawGlow(f.x2,f.y2,18,'#7dff8a',1-k); }
  else if(f.type==='ghost'){ ctx.globalAlpha=0.35*(1-k); ctx.fillStyle=f.color; ctx.beginPath(); ctx.ellipse(f.x,f.y+2,11,13,0,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(f.x,f.y-11,8,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  else if(f.type==='bolt'){ ctx.strokeStyle=`rgba(200,230,255,${1-k})`; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(f.x,f.y);
    for(let i=1;i<5;i++){ const t=i/5; ctx.lineTo(f.x+(f.x2-f.x)*t+rand(-8,8),f.y+(f.y2-f.y)*t+rand(-8,8)); } ctx.lineTo(f.x2,f.y2); ctx.stroke(); drawGlow(f.x2,f.y2,20,'#9fd8ff',1-k); }
}

let hudCache='';
function updHud(){
  const p=P, hp=Math.max(0,Math.ceil(p.hp)), mh=Math.round(p.maxHp);
  const key=hp+'|'+mh+'|'+run.gold+'|'+run.souls;
  if(key!==hudCache){ hudCache=key; $('hpFill').style.width=(hp/mh*100)+'%'; $('hpText').textContent=hp+' / '+mh; $('hGold').textContent=run.gold; $('hSouls').textContent=run.souls; }
  const cd=CHARS[p.cid].skill.cd*p.cdMul, sb=$('skillBtn');
  sb.style.setProperty('--p', p.skillT>0?(p.skillT/cd).toFixed(3):0); sb.classList.toggle('ready',p.skillT<=0);
  const db=$('dashBtn'); db.style.setProperty('--p', p.dashCd>0?(p.dashCd/(1.3*p.dashCdMul)).toFixed(3):0);
  if(G.boss) $('bossFill').style.width=Math.max(0,G.boss.hp/G.boss.maxHp*100)+'%';
}

/* ---------------- MENÜ-HINTERGRUND ---------------- */
const MB={ embers:[], t:0 };
function drawMenuBg(dt){
  MB.t+=dt; ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#120e16'; ctx.fillRect(0,0,W,H);
  const fx=save.settings.fx;
  if(fx && MB.embers.length<70 && Math.random()<dt*14) MB.embers.push({x:Math.random()*W,y:H+10,vy:-(20+Math.random()*45),ph:Math.random()*TAU,s:0.6+Math.random()*1.2,c:Math.random()<0.75?'#ff9a3a':'#e6b450'});
  ctx.globalCompositeOperation='lighter';
  drawGlow(W*0.5,H*1.05,Math.max(W,H)*0.6,'#ff5a1a',0.18+0.04*Math.sin(MB.t*1.3));
  for(const e of MB.embers){ e.y+=e.vy*dt; e.ph+=dt*2; e.x+=Math.sin(e.ph)*12*dt; drawGlow(e.x,e.y,4*e.s,e.c,Math.min(1,(e.y/H)*1.4)*0.9); }
  ctx.globalCompositeOperation='source-over';
  MB.embers=MB.embers.filter(e=>e.y>-10);
}

/* ---------------- SCHLEIFE ---------------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=clamp((now-last)/1000,0,0.05); last=now;
  if(state==='combat' && G){ if(G.stop>0){ G.stop-=dt; } else { if(G.stopCd>0) G.stopCd-=dt; update(dt); } if(G){ draw(); updHud(); } }
  else if(state==='paused' && G){ draw(); }
  else if(!G) drawMenuBg(dt);
}
resize(); showMenu(); requestAnimationFrame(loop);
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
