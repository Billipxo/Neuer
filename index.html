<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Arena der Verdammten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120e16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hudtop">
    <div class="hpwrap">
      <div class="hpbar"><div id="hpFill"></div><span id="hpText"></span></div>
      <div class="hudline"><span class="g">💰 <span id="hGold">0</span></span><span class="s">👻 <span id="hSouls">0</span></span></div>
    </div>
    <div id="hudRoom"></div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="bossBar" class="hidden"><div class="name" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="banner"></div>
  <div id="combo"></div>
  <button id="dashBtn" aria-label="Ausweichen">💨<div class="cd"></div><span class="lbl">Ausweichen</span></button>
  <button id="skillBtn" aria-label="Fähigkeit"><span id="skillIc"></span><div class="cd"></div><span class="lbl" id="skillLbl"></span></button>
</div>

<div id="ui"></div>
<div id="toast"></div>
<div id="fade"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
</body>
</html>
