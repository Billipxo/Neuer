<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Arena der Verdammten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120e16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
/* Layout: one full-screen canvas arena; menus are parchment-and-iron panels layered on top. */
:root{
  --night:#120e16;      /* page / void */
  --stone:#221b28;      /* panel ground */
  --stone-2:#2e2535;    /* raised panel */
  --iron:#4a3f52;       /* borders */
  --parch:#efe2c4;      /* main text */
  --parch-dim:#b7a88c;  /* secondary text */
  --gold:#e6b450;       /* accent: gold & highlights */
  --blood:#c8423a;      /* danger / HP */
  --soul:#8fd3ff;       /* soul currency */
  --c-common:#b9b2a6; --c-rare:#5aa9ff; --c-epic:#c77dff;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--parch);font-family:var(--f-body);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.hudtop{display:flex;gap:10px;align-items:flex-start}
.hpwrap{flex:1;max-width:260px;display:flex;flex-direction:column;gap:5px}
.hpbar{position:relative;height:20px;background:#00000080;border:2px solid var(--iron);border-radius:4px;overflow:hidden}
#hpFill{position:absolute;inset:0;width:100%;background:linear-gradient(#e2564d,#8f2620);transition:width .15s}
#hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hudline{display:flex;gap:12px;font-size:14px;font-weight:700;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.hudline .g{color:var(--gold)} .hudline .s{color:var(--soul)}
#hudRoom{margin-left:auto;text-align:right;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--parch-dim);text-shadow:0 1px 2px #000;padding-top:4px}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:8px;border:2px solid var(--iron);background:#000a;font-size:18px;flex:none}
#bossBar{margin:10px auto 0;max-width:420px;text-align:center}
#bossBar .name{font-family:var(--f-display);font-weight:800;color:var(--gold);letter-spacing:.08em;font-size:14px;text-shadow:0 1px 3px #000}
#bossBar .bar{height:10px;margin-top:4px;background:#000a;border:1px solid var(--iron);border-radius:3px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#7d1e9a,#d0453c)}
#skillBtn{pointer-events:auto;position:absolute;
  right:calc(max(16px, env(safe-area-inset-right,0px)) + 8px);
  bottom:calc(28px + env(safe-area-inset-bottom,0px));
  width:82px;height:82px;border-radius:50%;border:3px solid var(--gold);background:radial-gradient(circle at 40% 35%,#4a3a55,#1a1320);
  font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #e6b45055;touch-action:none}
#skillBtn .cd,#dashBtn .cd{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#000c calc(var(--p,0)*1turn),transparent 0);pointer-events:none}
#skillBtn.ready{animation:pulse 1.6s infinite}
#skillBtn .lbl,#dashBtn .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--f-display);white-space:nowrap;color:var(--parch-dim);text-shadow:0 1px 2px #000}
@keyframes pulse{50%{box-shadow:0 0 30px #e6b450aa}}
#dashBtn{pointer-events:auto;position:absolute;
  right:calc(max(16px, env(safe-area-inset-right,0px)) + 108px);
  bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:62px;height:62px;border-radius:50%;border:3px solid var(--soul);background:radial-gradient(circle at 40% 35%,#2c3b52,#121822);
  font-size:26px;display:flex;align-items:center;justify-content:center;touch-action:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px;border:2px solid var(--iron);border-radius:8px;background:var(--stone);font-size:16px;text-align:left}
.toggle .sw{flex:none;width:46px;height:26px;border-radius:99px;background:#0008;border:1px solid var(--iron);position:relative}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--parch-dim);transition:left .15s}
.toggle.on .sw{background:#6b4a1c;border-color:var(--gold)}
.toggle.on .sw::after{left:23px;background:var(--gold)}
.btn.danger{border-color:var(--blood);color:#ffb3ad}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,46px);color:var(--gold);
  text-shadow:0 3px 0 #000,0 0 24px #000;opacity:0;transition:opacity .3s;letter-spacing:.04em;padding:0 16px}
#banner.show{opacity:1}
#banner small{display:block;font-size:.42em;color:var(--parch);letter-spacing:.12em;margin-top:6px}

/* ---------- Screens ---------- */
#ui{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 0%,#2a1f31 0%,var(--night) 70%);
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
#ui.dim{background:#0c0910d9}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.03em}
h1{font-size:clamp(30px,9vw,46px);font-weight:800;line-height:1.05;color:var(--gold);text-shadow:0 3px 0 #000,0 0 30px #e6b45033}
h2{font-size:24px;color:var(--gold)}
h3{font-size:16px}
.sub{color:var(--parch-dim);font-size:15px;line-height:1.45;margin:0}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;font-size:17px;font-weight:700;
  border:2px solid var(--iron);border-radius:6px;background:linear-gradient(var(--stone-2),var(--stone));box-shadow:inset 0 1px 0 #ffffff14,0 3px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff14,0 1px 0 #000}
.btn.primary{border-color:var(--gold);background:linear-gradient(#6b4a1c,#3e2a10);color:#fff3d6}
.btn.small{padding:9px 12px;font-size:14px;width:auto}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:#0007;border:1px solid var(--iron);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.g{color:var(--gold)} .pill.s{color:var(--soul)} .pill.h{color:#ff8a80}
.title-block{text-align:center;padding-top:6vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.crest{width:120px;height:120px}
.menu-btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.foot{margin-top:auto;text-align:center;color:var(--parch-dim);font-size:13px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--parch-dim);text-decoration:underline;font-size:13px;padding:6px}

.card{position:relative;border:2px solid var(--iron);border-radius:8px;background:linear-gradient(170deg,var(--stone-2),var(--stone));padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.card .ic{font-size:30px;width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#0006}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .nm{font-family:var(--f-display);font-weight:800;font-size:16px}
.card .ds{color:var(--parch-dim);font-size:14px;line-height:1.35}
.card .pv{font-size:12.5px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.card .syn{font-size:12.5px;color:var(--c-epic);font-weight:700}
.card .rar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.card.common{border-color:#6f675e} .card.common .rar{color:var(--c-common)}
.card.rare{border-color:var(--c-rare);box-shadow:0 0 14px #5aa9ff33} .card.rare .rar{color:var(--c-rare)}
.card.epic{border-color:var(--c-epic);box-shadow:0 0 18px #c77dff44} .card.epic .rar{color:var(--c-epic)}
.card.sel{border-color:var(--gold)}
.card .price{margin-left:auto;align-self:center;flex:none}
.card:disabled{opacity:.5}
.cards{display:flex;flex-direction:column;gap:10px}
.reward-card{animation:dealIn .35s backwards}
.reward-card:nth-child(2){animation-delay:.08s}.reward-card:nth-child(3){animation-delay:.16s}.reward-card:nth-child(4){animation-delay:.24s}
@keyframes dealIn{from{transform:translateY(16px) scale(.97);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:12px;color:var(--parch-dim);margin-top:4px;font-variant-numeric:tabular-nums}
.stats b{color:var(--parch);display:block;font-size:14px}
.lvl{display:flex;gap:3px;margin-top:4px}
.lvl i{width:14px;height:6px;border-radius:2px;background:#0008;border:1px solid var(--iron)}
.lvl i.on{background:var(--soul);border-color:var(--soul)}

/* Map */
.mapscreen{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mapbox{position:relative;flex:1;min-height:420px;border:2px solid var(--iron);border-radius:10px;
  background:radial-gradient(ellipse at 50% 40%,#3a2f3a,#1c1620 75%);overflow:hidden}
.mapbox::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 2px,transparent 2px 7px);pointer-events:none}
.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:2px solid #6c5d66;background:#2b2230;font-size:22px;
  display:flex;align-items:center;justify-content:center;padding:0;opacity:.55}
.node.boss{width:68px;height:68px;font-size:34px;border-color:#8a2b2b}
.node.avail{opacity:1;border-color:var(--gold);box-shadow:0 0 0 4px #e6b45033,0 0 16px #e6b45088;animation:pulse 1.4s infinite}
.node.done{opacity:.9;background:#1a2a1e;border-color:#4f7a55}
.node.cur{border-color:#fff;opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--parch-dim);justify-content:center}
.relics{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.relic{font-size:16px;background:#0006;border:1px solid var(--iron);border-radius:6px;padding:2px 5px;position:relative}
.relic sup{font-size:10px;color:var(--gold);font-weight:700}

.scores{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.scores td,.scores th{padding:8px 6px;border-bottom:1px solid var(--iron);text-align:left;font-size:14px}
.scores th{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;color:var(--parch-dim);text-transform:uppercase}
.scores td.n{text-align:right;color:var(--gold);font-weight:700}
.center{text-align:center}
.bigscore{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.endstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.endstats div{background:#0005;border:1px solid var(--iron);border-radius:6px;padding:10px;display:flex;justify-content:space-between;font-size:14px}
.endstats b{font-variant-numeric:tabular-nums}
.help p{margin:0 0 10px;line-height:1.5;color:var(--parch)}
.help b{color:var(--gold)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hudtop">
    <div class="hpwrap">
      <div class="hpbar"><div id="hpFill"></div><span id="hpText"></span></div>
      <div class="hudline"><span class="g">💰 <span id="hGold">0</span></span><span class="s">👻 <span id="hSouls">0</span></span></div>
    </div>
    <div id="hudRoom"></div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="bossBar" class="hidden"><div class="name" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
  <div id="banner"></div>
  <button id="dashBtn" aria-label="Ausweichen">💨<div class="cd"></div><span class="lbl">Ausweichen</span></button>
  <button id="skillBtn" aria-label="Fähigkeit"><span id="skillIc"></span><div class="cd"></div><span class="lbl" id="skillLbl"></span></button>
</div>

<div id="ui"></div>

<script>
'use strict';
/* =========================================================
   ARENA DER VERDAMMTEN – ein Fantasy-Roguelike für das Handy
   ========================================================= */

/* ---------------- DATEN ---------------- */
const ACTS = [
  { name:'Die Verliese',    floorA:'#3b3e4a', floorB:'#343744', grout:'#22242c', wall:'#17181e', moss:'#4f6b3a', accent:'#9fb3d9', boss:'golem', pillar:'#5d6170', pillarTop:'#767b8b' },
  { name:'Die Krypta',      floorA:'#3c3346', floorB:'#352d3f', grout:'#211b28', wall:'#140f19', moss:'#6a3f8a', accent:'#c49cf0', boss:'lich', pillar:'#4f4559', pillarTop:'#685b75' },
  { name:'Der Drachenhort', floorA:'#46302d', floorB:'#3d2a27', grout:'#201211', wall:'#140a09', moss:'#d2551f', accent:'#ff9a4a', boss:'dragon', pillar:'#5b3b35', pillarTop:'#77504a' },
];

const CHARS = {
  krieger:{ name:'Krieger',  icon:'🛡️', cost:0,   color:'#3f6fc4', hp:135, speed:150, dmg:22, rate:0.7, range:66,  attack:'melee', armor:2,
    desc:'Robuster Nahkämpfer mit Rüstung. Schwingt sein Schwert in weitem Bogen.',
    skill:{ name:'Wirbelwind', icon:'🌀', cd:8, desc:'Wirbelt 1,5 Sek. und trifft alles ringsum.' } },
  magier: { name:'Magierin', icon:'🔮', cost:120, color:'#7d48c9', hp:85,  speed:142, dmg:15, rate:0.62, range:300, attack:'bolt',  armor:0,
    desc:'Zielsuchende Arkangeschosse, die beim Aufprall explodieren.',
    skill:{ name:'Frostnova', icon:'❄️', cd:9, desc:'Eisexplosion, die nahe Gegner einfriert.' } },
  jaegerin:{ name:'Jägerin', icon:'🏹', cost:250, color:'#3b8f55', hp:95,  speed:172, dmg:11, rate:0.38, range:340, attack:'arrow', armor:0,
    desc:'Schnell und präzise. Ihre Pfeile durchbohren Gegner.',
    skill:{ name:'Pfeilhagel', icon:'🎯', cd:7, desc:'Ein Ring aus Pfeilen in alle Richtungen.' } },
};

const ENEMIES = {
  slime:   { name:'Schleim',   hp:22, speed:58,  dmg:8,  r:14, cost:1,   ai:'hop',     gold:1 },
  bat:     { name:'Fledermaus',hp:12, speed:128, dmg:6,  r:10, cost:1,   ai:'bat',     gold:1 },
  skeleton:{ name:'Skelett',   hp:32, speed:74,  dmg:10, r:13, cost:1.5, ai:'chase',   gold:1 },
  archer:  { name:'Goblin',    hp:24, speed:62,  dmg:9,  r:13, cost:2,   ai:'ranged',  gold:2, fire:2.3 },
  orc:     { name:'Ork',       hp:95, speed:48,  dmg:16, r:20, cost:3.5, ai:'charger', gold:3, minRow:2 },
  cultist: { name:'Kultist',   hp:42, speed:55,  dmg:9,  r:14, cost:2.5, ai:'caster',  gold:2, fire:2.6, minAct:2 },
  imp:     { name:'Feuerteufel',hp:34,speed:100, dmg:10, r:12, cost:2.2, ai:'imp',     gold:2, fire:1.8, minAct:3 },
};

const BOSSES = {
  golem: { name:'Der Steingolem', hp:750,  speed:42, dmg:20, r:40 },
  lich:  { name:'Der Lichkönig',  hp:1150, speed:60, dmg:18, r:28 },
  dragon:{ name:'Ignaroth, der Drache', hp:1750, speed:58, dmg:24, r:44 },
};

const RAR = { common:'Gewöhnlich', rare:'Selten', epic:'Episch' };
const UPGRADES = [
  { id:'dmg',   r:'common', ic:'⚔️', nm:'Geschärfte Waffe', ds:'+15 % Schaden',               ap:p=>p.dmg*=1.15 },
  { id:'rate',  r:'common', ic:'🗡️', nm:'Flinke Hände',     ds:'+12 % Angriffstempo',         ap:p=>p.atkSpd*=1.12 },
  { id:'speed', r:'common', ic:'👢', nm:'Windstiefel',      ds:'+10 % Laufgeschwindigkeit',   ap:p=>p.spdMul*=1.10, max:5 },
  { id:'hp',    r:'common', ic:'❤️', nm:'Trollblut',        ds:'+20 max. LP und heilt 20 LP', ap:p=>{p.maxHp+=20;p.hp=Math.min(p.maxHp,p.hp+20);} },
  { id:'armor', r:'common', ic:'🛡️', nm:'Eisenhaut',        ds:'Erlittener Schaden −2',       ap:p=>p.armor+=2, max:5 },
  { id:'regen', r:'common', ic:'🌿', nm:'Heilkräuter',      ds:'Regeneriert 0,6 LP pro Sekunde', ap:p=>p.regen+=0.6 },
  { id:'gold',  r:'common', ic:'💰', nm:'Goldgier',         ds:'+30 % Gold von Gegnern',      ap:p=>p.goldMul+=0.3, max:4 },
  { id:'area',  r:'common', ic:'🎯', nm:'Weite Reichweite', ds:'+15 % Reichweite und Wirkfläche', ap:p=>p.area*=1.15, max:5 },
  { id:'crit',  r:'rare',   ic:'👁️', nm:'Adlerauge',        ds:'+10 % kritische Trefferchance', ap:p=>p.crit+=0.10, max:5 },
  { id:'multi', r:'rare',   ic:'✨', nm:'Mehrfachangriff',  ds:'+1 Geschoss bzw. Schwerthieb', ap:p=>p.count+=1, max:3 },
  { id:'leech', r:'rare',   ic:'🩸', nm:'Blutdurst',        ds:'Heilt 2 LP pro besiegtem Gegner', ap:p=>p.lifeOnKill+=2 },
  { id:'thorns',r:'rare',   ic:'🌵', nm:'Dornenrüstung',    ds:'Wer dich trifft, erleidet 20 Schaden', ap:p=>p.thorns+=20 },
  { id:'cd',    r:'rare',   ic:'🔮', nm:'Arkanes Wissen',   ds:'−20 % Abklingzeit der Fähigkeit', ap:p=>p.cdMul*=0.8, max:3 },
  { id:'pierce',r:'rare',   ic:'➹',  nm:'Durchschlag',      ds:'Pfeile durchbohren +1 Gegner', ap:p=>p.pierce+=1, max:3, only:['jaegerin'] },
  { id:'shield',r:'rare',   ic:'🔰', nm:'Schutzrune',       ds:'Blockt den ersten Treffer in jedem Raum', ap:p=>p.shield+=1, max:3 },
  { id:'orbit', r:'epic',   ic:'🔥', nm:'Feuerkugeln',      ds:'+1 Feuerkugel kreist um dich', ap:p=>p.orbit+=1, max:4 },
  { id:'chain', r:'epic',   ic:'⚡', nm:'Kettenblitz',      ds:'Treffer lösen manchmal Blitze aus, die überspringen', ap:p=>p.chain+=1, max:3 },
  { id:'boom',  r:'epic',   ic:'💥', nm:'Explosive Seelen', ds:'Besiegte Gegner explodieren', ap:p=>p.explode+=1, max:3 },

function wpick(list){ let t=0; for(const [,w] of list) t+=w; let r=Math.random()*t; for(const [v,w] of list){ if((r-=w)<=0) return v; } return list[0][0]; }

function sfx(type){
  if(!save.sound || !AC) return;
  const now=AC.currentTime; if(lastSfx[type] && now-lastSfx[type]<0.05) return; lastSfx[type]=now;
  const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
  const S={ hit:['square',220,90,.05,.06], swing:['triangle',300,120,.06,.08], coin:['sine',900,1500,.05,.07], hurt:['sawtooth',160,50,.1,.22],
    kill:['triangle',180,60,.06,.12], shoot:['sine',600,300,.03,.07], skill:['sawtooth',120,600,.08,.35], boom:['sawtooth',90,30,.12,.3],
    pick:['sine',500,1000,.08,.18], dash:['sine',260,820,.06,.14], boss:['sawtooth',70,40,.12,.8] }[type];
  if(!S) return;
  o.type=S[0]; o.frequency.setValueAtTime(S[1],now); o.frequency.exponentialRampToValueAtTime(S[2],now+S[4]);
  g.gain.setValueAtTime(S[3],now); g.gain.exponentialRampToValueAtTime(0.0001,now+S[4]);

}

const glowCache={};
function glow(color){
  if(glowCache[color]) return glowCache[color];
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,color); gr.addColorStop(0.35,color+'88'); gr.addColorStop(1,color+'00');
  g.fillStyle=gr; g.fillRect(0,0,64,64); return glowCache[color]=c;
}

let floorCanvas=null, floorAct=-1;
function buildFloor(){
  const A=ACTS[run.act-1]; const k=Math.min(2,SCALE*DPR);
  const c=document.createElement('canvas'); c.width=Math.ceil((AW+WALL*2)*k); c.height=Math.ceil((AH+WALL*2)*k);
  const g=c.getContext('2d'); g.scale(k,k); g.translate(WALL,WALL);
  g.fillStyle=A.wall; g.fillRect(-WALL,-WALL,AW+WALL*2,AH+WALL*2);
  g.fillStyle=A.grout; g.fillRect(0,0,AW,AH);
  const T=48;
  for(let y=0;y<AH;y+=T) for(let x=0;x<AW;x+=T){
    const off=((y/T)%2)*T/2;
    g.fillStyle=Math.random()<0.5?A.floorA:A.floorB; g.globalAlpha=rand(0.82,1);
    g.fillRect(x-off+2,y+2,T-4,T-4);
    g.globalAlpha=1;
  }
  // second pass to fill offset gaps at left edge
  for(let y=T;y<AH;y+=T*2){ g.fillStyle=A.floorB; g.fillRect(AW-T/2+2,y+2,T/2-4,T-4); }
  // cracks
  g.strokeStyle='rgba(0,0,0,0.35)'; g.lineWidth=1.2;
  for(let i=0;i<40;i++){ let x=rand(0,AW),y=rand(0,AH); g.beginPath(); g.moveTo(x,y); for(let j=0;j<4;j++){x+=rand(-18,18);y+=rand(-18,18);g.lineTo(x,y);} g.stroke(); }
  // moss / runes / lava
  for(let i=0;i<26;i++){
    const x=rand(0,AW),y=rand(0,AH),r=rand(8,26);
    g.globalAlpha=run.act===3?0.22:0.18; g.fillStyle=A.moss; g.beginPath(); g.ellipse(x,y,r,r*0.6,rand(0,3),0,TAU); g.fill();
  }
  g.globalAlpha=1;
  if(run.act===3){ g.strokeStyle='rgba(255,110,40,0.35)'; g.lineWidth=2;
    for(let i=0;i<14;i++){ let x=rand(0,AW),y=rand(0,AH); g.beginPath(); g.moveTo(x,y); for(let j=0;j<6;j++){x+=rand(-26,26);y+=rand(-26,26);g.lineTo(x,y);} g.stroke(); } }
  // center emblem
  g.strokeStyle=A.accent; g.globalAlpha=0.13; g.lineWidth=3;
  g.beginPath(); g.arc(AW/2,AH/2,150,0,TAU); g.stroke(); g.beginPath(); g.arc(AW/2,AH/2,120,0,TAU); g.stroke();
  for(let i=0;i<8;i++){ const a=i/8*TAU; g.beginPath(); g.moveTo(AW/2+Math.cos(a)*120,AH/2+Math.sin(a)*120); g.lineTo(AW/2+Math.cos(a+TAU*3/8)*120,AH/2+Math.sin(a+TAU*3/8)*120); g.stroke(); }
  g.globalAlpha=1;
  // wall bricks
  g.fillStyle='rgba(255,255,255,0.04)';
  for(let y=-WALL;y<AH+WALL;y+=16) for(let x=-WALL;x<AW+WALL;x+=30){
    if(x>4&&x<AW-30&&y>4&&y<AH-16) continue;
    g.fillRect(x+((y/16)%2?15:0),y,27,13);
  }
  g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=6; g.strokeRect(-3,-3,AW+6,AH+6);
  g.strokeStyle=A.accent; g.globalAlpha=0.25; g.lineWidth=2; g.strokeRect(-7,-7,AW+14,AH+14); g.globalAlpha=1;
  floorCanvas=c; floorAct=run.act; floorCanvas.k=k;
}

const JR=56;
cvs.addEventListener('pointerdown',e=>{
  audio(); if(state!=='combat') return;
  if(input.id===null){ input.id=e.pointerId; input.ox=input.cx=e.clientX; input.oy=input.cy=e.clientY; input.jx=input.jy=0; try{cvs.setPointerCapture(e.pointerId);}catch(_){} }

  if(l>JR){ input.ox+= dx/l*(l-JR); input.oy+= dy/l*(l-JR); dx=input.cx-input.ox; dy=input.cy-input.oy; }
  const m=Math.min(1,Math.hypot(dx,dy)/JR), ll=Math.hypot(dx,dy)||1;
  input.jx=dx/ll*(m<0.12?0:m); input.jy=dy/ll*(m<0.12?0:m);
});

function genMap(act){
  const R=6, rows=[];
  for(let r=0;r<R;r++){
    const n = r===0 ? randi(2,3) : r===R-1 ? randi(2,3) : randi(2,4), row=[];
    for(let i=0;i<n;i++) row.push({ id:act+'_'+r+'_'+i, row:r, x:(i+1)/(n+1)+rand(-0.035,0.035), type:'fight', next:[] });
    rows.push(row);
  }
  for(let r=1;r<R;r++) for(const nd of rows[r]){
    nd.type = r===R-1 ? wpick([['rest',55],['shop',45]]) :
      wpick([['fight',46],['elite',r>=2?18:0],['shop',r>=2?11:5],['rest',r>=2?9:0],['treasure',r>=1?9:0]]);
  }
  if(!rows.slice(1,R-1).some(rw=>rw.some(n=>n.type==='shop'))) pick(rows[3]).type='shop';
  if(!rows.slice(2,R-1).some(rw=>rw.some(n=>n.type==='elite'))) pick(rows[2]).type='elite';
  for(let r=0;r<R-1;r++){
    const a=rows[r], b=rows[r+1];
    a.forEach((nd,i)=>{
      const j = a.length===1 ? 0 : Math.round(i*(b.length-1)/(a.length-1));
      nd.next.push(b[j].id);
      if(Math.random()<0.45){ const j2=clamp(j+(Math.random()<0.5?-1:1),0,b.length-1); if(!nd.next.includes(b[j2].id)) nd.next.push(b[j2].id); }
    });
    b.forEach((nb,j)=>{ if(!a.some(n=>n.next.includes(nb.id))){ let best=a[0]; for(const n of a) if(Math.abs(n.x-nb.x)<Math.abs(best.x-nb.x)) best=n; best.next.push(nb.id); } });
  }
  const boss={ id:act+'_boss', row:R, x:0.5, type:'boss', next:[] };
  rows[R-1].forEach(n=>n.next.push(boss.id));
  return { rows, boss, R };
}
function allNodes(){ return [...run.map.rows.flat(), run.map.boss]; }
function nodeById(id){ return allNodes().find(n=>n.id===id); }

  render(`<div class="wrap"><div class="eyebrow">Optionen</div><h2>Einstellungen</h2>

function relicsHtml(){
  const e=Object.entries(run.upg); if(!e.length) return '<span class="sub" style="font-size:13px">Noch keine Upgrades</span>';
  return e.map(([id,n])=>`<span class="relic" title="${UPG[id].nm}">${UPG[id].ic}${n>1?`<sup>${n}</sup>`:''}</span>`).join('');
}

function showMap(){
  state='ui'; save.run=run; persist();
  const av=availNodes(), A=ACTS[run.act-1], R=run.map.R;
  const ys=r=> r===R ? 10 : 91 - r*(68/(R-1));
  const nodes=allNodes();
  let lines='';
  for(const n of nodes) for(const id of n.next){ const m=nodeById(id);
    const taken = run.visited.includes(n.id) && run.visited.includes(m.id);
    const open = n.id===run.posId && av.includes(m.id);
    lines+=`<line x1="${n.x*100}" y1="${ys(n.row)}" x2="${m.x*100}" y2="${ys(m.row)}" stroke="${taken||open?'#e6b450':'#8d7f86'}" stroke-opacity="${taken?0.9:open?0.6:0.35}" stroke-width="${taken?3:2}" stroke-dasharray="${taken?'':'4 5'}" vector-effect="non-scaling-stroke"/>`;
  }
  const btns=nodes.map(n=>{
    const cls=['node', n.type==='boss'?'boss':'', av.includes(n.id)?'avail':'', run.visited.includes(n.id)?'done':'', n.id===run.posId?'cur':''].join(' ');
    return `<button class="${cls}" style="left:${n.x*100}%;top:${ys(n.row)}%" data-a="${av.includes(n.id)?'go':'x'}" data-v="${n.id}" aria-label="${NODE[n.type].nm}">${NODE[n.type].ic}</button>`;
  }).join('');
  const p=run.p;
  render(`<div class="mapscreen">
    <div class="maphead"><div><div class="eyebrow">Akt ${run.act} von 3</div><h2>${A.name}</h2></div>
      <button class="btn small" data-a="menu">☰ Menü</button></div>
    <div class="row" style="gap:6px"><span class="pill h">❤️ ${Math.ceil(p.hp)}/${Math.round(p.maxHp)}</span><span class="pill g">💰 ${run.gold}</span><span class="pill s">👻 ${run.souls}</span><span class="pill">${CHARS[run.cid].icon} ${CHARS[run.cid].name}</span></div>
    <div class="mapbox"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>${btns}</div>
    <div class="legend">${Object.values(NODE).map(n=>`<span>${n.ic} ${n.nm}</span>`).join('')}</div>
    <div class="relics">${relicsHtml()}</div>
  </div>`,
  { go:id=>enterNode(id), x:()=>{}, menu:showRunMenu });
}

function enterNode(id){
  const n=nodeById(id); run.posId=id; run.visited.push(id);
  if(n.type==='fight'||n.type==='elite'||n.type==='boss') startCombat(n.type);
  else { run.rooms++; save.run=run; persist();
    if(n.type==='shop') showShop(); else if(n.type==='rest') showRest(); else showReward('treasure', showMap); }
}

/* ---- Upgrades ---- */
function availUpgrades(){ return UPGRADES.filter(u=>(!u.only||u.only.includes(run.cid)) && (!u.max || (run.upg[u.id]||0)<u.max)); }
function rollUpgrades(n, mode, exclude=[]){
  const L=metaLvl('m_luck')*4;
  const w={ normal:[62-L,30,8+L], elite:[30-L,48,22+L], treasure:[10,52-L,38+L], boss:[0,45,55] }[mode]||[62,30,8];
  const pool=availUpgrades().filter(u=>!exclude.includes(u.id)), out=[];
  for(let i=0;i<n && pool.length;i++){
    let r=wpick([['common',w[0]],['rare',w[1]],['epic',w[2]]]);
    let opts=pool.filter(u=>u.r===r && !out.includes(u)); if(!opts.length) opts=pool.filter(u=>!out.includes(u)); if(!opts.length) break;
    out.push(pick(opts));
  }
  return out;
}
function checkSyn(){ run.syn=run.syn||[]; const out=[]; for(const s of SYN){ if(!run.syn.includes(s.id) && s.req.every(r=>run.upg[r])){ run.syn.push(s.id); out.push(s); } } return out; }
function applyUpgrade(u){ u.ap(run.p); run.upg[u.id]=(run.upg[u.id]||0)+1; sfx('pick'); return checkSyn(); }
function showSynergy(list, after){
  sfx('skill');
  render(`<div class="wrap" style="justify-content:center"><div class="eyebrow center">Zwei Kräfte verbinden sich</div><h2 class="center">Synergie entdeckt!</h2>
    <div class="cards">${list.map(s=>`<div class="card epic reward-card"><div class="ic">${s.ic}</div><div class="body"><div class="rar">Synergie · ${s.req.map(r=>UPG[r].ic).join(' + ')}</div><div class="nm">${s.nm}</div><div class="ds">${s.ds}</div></div></div>`).join('')}</div>
    <button class="btn primary" data-a="go">Weiter</button></div>`,{ go:after },true);
}
function statSheet(p){
  const c=CHARS[p.cid], s={ 'Schaden':Math.round(p.dmg), 'Angriffe/Sek':(p.atkSpd/p.rate).toFixed(2), 'Max. LP':Math.round(p.maxHp), 'Rüstung':p.armor,
    'Tempo':Math.round(p.speed*p.spdMul), 'Krit':Math.round(p.crit*100)+' %', 'Fläche':Math.round(p.area*100)+' %', 'Gold':Math.round(p.goldMul*100)+' %',
    'Geschosse':p.count, 'Fähigkeit':(c.skill.cd*p.cdMul).toFixed(1)+' s', 'Ausweichen':(1.3*p.dashCdMul).toFixed(1)+' s' };
  if(p.regen) s['Regeneration']=p.regen.toFixed(1)+'/s'; if(p.pierce) s['Durchschlag']=p.pierce; if(p.lifeOnKill) s['LP pro Kill']=p.lifeOnKill; if(p.thorns) s['Dornen']=p.thorns;
  return s;
}
function previewUpg(u){
  const a=statSheet(run.p), q=JSON.parse(JSON.stringify(run.p)); u.ap(q); const b=statSheet(q);
  return Object.keys(b).filter(k=>a[k]!==b[k]).map(k=>`${k} ${a[k]??0} → ${b[k]}`);
}
function synHint(u){ const s=SYN.find(s=>!hasSyn(s.id) && s.req.includes(u.id) && s.req.every(r=>r===u.id||run.upg[r])); return s?`<div class="syn">${s.ic} Ergibt Synergie: ${s.nm}</div>`:''; }
function statsHtml(p){ return `<div class="stats" style="grid-template-columns:repeat(3,1fr);background:#0006;border:1px solid var(--iron);border-radius:8px;padding:12px">${Object.entries(statSheet(p)).map(([k,v])=>`<span>${k}<b>${v}</b></span>`).join('')}</div>`; }
function synHtml(){ if(!run||!run.syn||!run.syn.length) return ''; return `<div class="cards">${run.syn.map(id=>{ const s=SYN.find(x=>x.id===id); return `<div class="card epic"><div class="ic">${s.ic}</div><div class="body"><div class="rar">Synergie aktiv</div><div class="nm">${s.nm}</div><div class="ds">${s.ds}</div></div></div>`; }).join('')}</div>`; }
function upgCard(u,extra='',act='pick'){
  const n=run.upg[u.id]||0;
  return `<button class="card reward-card ${u.r}" data-a="${act}" data-v="${u.id}">
    <div class="ic">${u.ic}</div><div class="body"><div class="rar">${RAR[u.r]}${u.only?' · '+CHARS[u.only[0]].name:''}${n?` · Stufe ${n+1}`:''}</div><div class="nm">${u.nm}</div><div class="ds">${u.ds}</div>${(()=>{const pv=previewUpg(u); return pv.length?`<div class="pv">${pv.join(' · ')}</div>`:'';})()}${synHint(u)}</div>${extra}</button>`;
}
function showReward(mode, after, offer){
  state='ui';
  offer = offer || rollUpgrades(3, mode);
  const title={ normal:'Sieg!', elite:'Elite bezwungen!', treasure:'Ein Schatz!', boss:'Der Boss ist gefallen!' }[mode];
  render(`<div class="wrap"><div class="eyebrow">Wähle eine Belohnung</div><h2>${title}</h2>
    <div class="row" style="gap:6px"><span class="pill h">❤️ ${Math.ceil(run.p.hp)}/${Math.round(run.p.maxHp)}</span><span class="pill g">💰 ${run.gold}</span></div>
    <div class="cards">${offer.map(u=>upgCard(u)).join('')}</div>
    <div class="row">${run.rerolls>0?`<button class="btn" data-a="reroll">🎲 Neu würfeln (${run.rerolls})</button>`:''}
      <button class="btn" data-a="skip">Überspringen (+15 💰)</button></div></div>`,
  { pick:id=>{ const ns=applyUpgrade(UPG[id]); ns.length?showSynergy(ns,after):after(); },
    reroll:()=>{ run.rerolls--; showReward(mode, after, rollUpgrades(3,mode,offer.map(u=>u.id))); },
    skip:()=>{ run.gold+=15; after(); } },true);
}

/* ---------------- KAMPF ---------------- */
function enemyPool(act,row){ return Object.keys(ENEMIES).filter(k=>{ const d=ENEMIES[k]; return (!d.minAct||act>=d.minAct) && (!d.minRow||row>=d.minRow||act>1); }); }
function buildWaves(type){
  const act=run.act, row=nodeById(run.posId).row, depth=(act-1)*6+row;
  const pool=enemyPool(act,row), nW = type==='elite'?2:(row<2?2:3), waves=[];
  for(let w=0;w<nW;w++){
    let budget=(5+depth*1.25+w*1.5)*(type==='elite'?0.7:1); const list=[];
    while(budget>0){ const k=pick(pool); list.push({kind:k}); budget-=ENEMIES[k].cost; }
    if(type==='elite') list.push({kind:pick(pool.filter(k=>k!=='bat')), elite:true});
    waves.push(list);
  }
  return waves;
}

const FLY={bat:1,imp:1,lich:1,dragon:1};
function genArena(type){
  const obs=[], traps=[], start={x:AW/2,y:AH*0.7}, act=run.act;
  const free=(x,y,r)=> Math.hypot(x-start.x,y-start.y)>r+80 && x>r+24 && x<AW-r-24 && y>r+24 && y<AH-r-24
    && obs.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+34) && traps.every(t=>Math.hypot(t.x-x,t.y-y)>t.r+r+24);
  let pts=[];
  if(type==='boss') pts=[[150,210],[610,210],[150,800],[610,800]];
  else {
    const L=pick(['open','four','ring','corridor','scatter','cross','scatter','four']);
    if(L==='four') pts=[[200,290],[560,290],[200,640],[560,640]];
    if(L==='ring'){ for(let i=0;i<6;i++){ const a=i/6*TAU+0.5; pts.push([AW/2+Math.cos(a)*230,AH*0.45+Math.sin(a)*230]); } }
    if(L==='corridor') pts=[[130,420],[250,420],[510,580],[630,580]];
    if(L==='cross') pts=[[AW/2,250],[AW/2,520],[190,AH/2],[570,AH/2]];
    if(L==='scatter') for(let i=0;i<6;i++) pts.push([rand(90,AW-90),rand(90,AH-90)]);
  }
  for(const [x,y] of pts){ const r=type==='boss'?30:pick([24,28,32]); if(free(x,y,r)) obs.push({type:'pillar',x,y,r}); }
  if(type==='boss'){ if(act===3) for(const x of [120,640]) traps.push({type:'lava',x,y:AH/2,r:48,tick:0}); }
  else {
    if(act===3) for(let i=randi(2,3),k=0;i>0&&k<40;k++){ const r=rand(40,62),x=rand(80,AW-80),y=rand(80,AH-80); if(free(x,y,r)){ traps.push({type:'lava',x,y,r,tick:0}); i--; } }
    else for(let i=randi(1,3),k=0;i>0&&k<40;k++){ const x=rand(80,AW-80),y=rand(80,AH-80); if(free(x,y,30)){ traps.push({type:'spikes',x,y,r:30,t:rand(0,2.8)}); i--; } }
    for(let i=randi(2,4),k=0;i>0&&k<40;k++){ const x=rand(60,AW-60),y=rand(60,AH-60); if(free(x,y,14)){ obs.push({type:'barrel',x,y,r:14}); i--; } }
  }
  traps.forEach((t,i)=>t.id=i);
  return {obs,traps};
}
function solidHit(x,y,r){ for(const o of G.obs) if(!o.dead && Math.hypot(o.x-x,o.y-y)<o.r+r) return o; return null; }
function pushOut(ent, slide=0){
  let hit=false;
  for(const o of G.obs){ if(o.dead) continue; const dx=ent.x-o.x, dy=ent.y-o.y, d=Math.hypot(dx,dy)||0.01, m=ent.r+o.r;
    if(d<m){ ent.x=o.x+dx/d*m; ent.y=o.y+dy/d*m; if(slide){ ent.x+=-dy/d*slide; ent.y+=dx/d*slide; } hit=true; } }
  ent.x=clamp(ent.x,ent.r,AW-ent.r); ent.y=clamp(ent.y,ent.r,AH-ent.r);
  return hit;
}
function los(a,b){
  for(const o of G.obs){ if(o.dead||o.type!=='pillar') continue;
    const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy||1, t=clamp(((o.x-a.x)*dx+(o.y-a.y)*dy)/L,0,1);
    if(Math.hypot(a.x+dx*t-o.x,a.y+dy*t-o.y)<o.r-3) return false; }
  return true;
}
function blowBarrel(o){
  if(o.dead) return; o.dead=true;
  G.booms.push({x:o.x,y:o.y,r:80,dmg:Math.max(40*(1+0.5*(run.act-1)),P.dmg*2),barrel:true});
}
function startCombat(type){
  const p=run.p;
  P=Object.assign(p,{ x:AW/2, y:AH*0.7, r:14, vx:0, vy:0, face:-Math.PI/2, atkT:0.3, skillT:0, inv:0, shieldLeft:p.shield, spin:0, spinTick:0, regenAcc:0, moving:false, anim:0, swingT:0, dashT:0, dashCd:0, dashA:0, dashI:0, msT:0, trailT:0, nextCrit:false });
  P.shieldLeft = p.shield + (p.manaShield?1:0);
  G={ type, enemies:[], pproj:[], eproj:[], hazards:[], pzones:[], pstrikes:[], parts:[], texts:[], coins:[], fx:[], spawnQ:[], booms:[],
      stop:0, stopCd:0, waves: type==='boss'?[]:buildWaves(type), obs:[], traps:[], waveIdx:-1, waveT:0.8, cleared:false, clearT:0, time:0, shake:0, hurtFlash:0, orbitA:0, boss:null, over:false, hint:run.rooms===0?5:0 };
  Object.assign(G, genArena(type));
  if(type==='boss'){
    const bk=ACTS[run.act-1].boss; G.waveIdx=0; G.waveT=99;
    G.spawnQ.push({x:AW/2,y:AH*0.3,t:1.6,kind:bk,boss:true});

  }
  if(!floorCanvas||floorAct!==run.act) buildFloor();
  input.id=null; input.jx=input.jy=0; $('banner').classList.remove('show');
  ui.classList.add('hidden'); $('hud').classList.remove('hidden');
  const c=CHARS[run.cid]; $('skillIc').textContent=c.skill.icon; $('skillLbl').textContent=c.skill.name;
  $('bossBar').classList.toggle('hidden', type!=='boss');
  $('hudRoom').innerHTML=`Akt ${run.act}<br>${NODE[type].nm}`;
  state='combat'; last=performance.now();

function makeEnemy(kind,x,y,elite){
  const d=ENEMIES[kind], act=run.act, row=nodeById(run.posId).row;
  const hs=1+0.6*(act-1)+0.07*row, ds=1+0.3*(act-1)+0.03*row;
  const e={ kind, x,y, r:d.r, hp:d.hp*hs, dmg:d.dmg*ds, speed:d.speed*rand(0.9,1.1), ai:d.ai, t:rand(0,3), seed:rand(0,TAU), flash:0, slow:0, freeze:0, kx:0, ky:0,
    elite:!!elite, gold:d.gold, soul:1, st:0, timer:rand(1,2.5), dir:Math.random()<0.5?1:-1, face:0, orbCd:0, squish:0, fire:d.fire||2 };
  if(elite){ e.hp*=3.2; e.r*=1.35; e.dmg*=1.3; e.gold*=4; e.soul=5; }
  e.maxHp=e.hp; return e;
}
function makeBoss(kind,x,y){
  const b=BOSSES[kind], s=1+0.08*metaLvl('m_dmg');
  const e={ kind, boss:true, x,y, r:b.r, hp:b.hp*s, maxHp:b.hp*s, dmg:b.dmg, speed:b.speed, ai:kind, t:0, flash:0, slow:0, freeze:0, kx:0, ky:0, soul:0, gold:0,
    st:0, timer:2, cast:null, castT:0, face:Math.PI/2, alpha:1, seed:0, orbCd:0, phase2:false, spiral:0 };
  G.boss=e; $('bossName').textContent=b.name; return e;
}

function nextWave(){
  G.waveIdx++; const list=G.waves[G.waveIdx];
  list.forEach((s,i)=>{
    let x,y,tries=0; do{ x=rand(40,AW-40); y=rand(40,AH-40); tries++; }while((Math.hypot(x-P.x,y-P.y)<220 || solidHit(x,y,24) || G.traps.some(t=>t.type==='lava'&&Math.hypot(t.x-x,t.y-y)<t.r+20)) && tries<40);
    G.spawnQ.push({x,y,t:0.9+i*0.12,kind:s.kind,elite:s.elite});
  });
}

function update(dt){
  G.time+=dt; if(G.hint>0) G.hint-=dt;
  // spawns
  for(const s of G.spawnQ){ s.t-=dt; if(s.t<=0){ G.enemies.push(s.boss?makeBoss(s.kind,s.x,s.y):makeEnemy(s.kind,s.x,s.y,s.elite)); burst(s.x,s.y,s.boss?40:10,'#b69cff',s.boss?220:120); } }
  G.spawnQ=G.spawnQ.filter(s=>s.t>0);
  if(!G.cleared && G.type!=='boss' && G.enemies.length===0 && G.spawnQ.length===0){
    if(G.waveIdx < G.waves.length-1){ G.waveT-=dt; if(G.waveT<=0){ nextWave(); G.waveT=1.0; if(G.waveIdx>0) banner('Welle '+(G.waveIdx+1)); } }
    else clearRoom();
  }
  if(!G.over) updPlayer(dt);
  for(const e of G.enemies) updEnemy(e,dt);
  separate();
  updProjectiles(dt);
  updHazards(dt);
  for(const z of G.pzones){ z.life-=dt; z.tick-=dt;
    if(z.tick<=0){ z.tick=0.3; for(const e of G.enemies){ if(!e.dead && Math.hypot(e.x-z.x,e.y-z.y)<z.r+e.r) dealDamage(e,z.dps*0.3,{noChain:true,noCrit:true,color:'#c9a0ff'}); } }
    if(Math.random()<dt*3) part(z.x+rand(-10,10),z.y,0,-40,0.5,4,'#9a5aff',true); }
  G.pzones=G.pzones.filter(z=>z.life>0);
  for(const s of G.pstrikes){ s.t+=dt; if(s.t>=s.delay){ s.done=true; explosion(s.x,s.y,s.r,s.dmg,'#8ec8ff'); G.shake+=4; } }
  G.pstrikes=G.pstrikes.filter(s=>!s.done);
  // pending explosions (Explosive Seelen)
  const bl=G.booms; G.booms=[]; for(const b of bl){ explosion(b.x,b.y,b.r,b.dmg,b.barrel?'#ffb03a':'#ff8a3a',true);
    if(b.barrel){ G.shake+=6; for(let i=0;i<10;i++) part(b.x,b.y,rand(-160,160),rand(-160,160),0.6,rand(2,4),'#6b4a2a'); if(Math.hypot(P.x-b.x,P.y-b.y)<b.r+P.r*0.5) hurtPlayer(10+3*run.act,null); } }
  G.obs=G.obs.filter(o=>!o.dead);
  updTraps(dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updCoins(dt);
  for(const p of G.parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-p.drag*dt; p.vy*=1-p.drag*dt; p.vy+=p.grav*dt; }
  G.parts=G.parts.filter(p=>p.life>0); if(G.parts.length>450) G.parts.splice(0,G.parts.length-450);
  for(const t of G.texts){ t.t+=dt; t.y-=32*dt; } G.texts=G.texts.filter(t=>t.t<0.8);
  for(const f of G.fx) f.t+=dt; G.fx=G.fx.filter(f=>f.t<f.life);
  G.shake=Math.max(0,G.shake-dt*30); G.hurtFlash=Math.max(0,G.hurtFlash-dt);
  if(G.cleared){ G.clearT+=dt; if((G.clearT>1.5 && G.coins.length===0) || G.clearT>3.5) finishCombat(); }
}

function updPlayer(dt){
  const p=P; const [mx,my]=readMove();
  const sp=p.speed*p.spdMul*(p.spin>0?1.25:1);
  if(p.dashCd>0) p.dashCd-=dt; if(p.dashI>0) p.dashI-=dt;
  if(p.dashT>0){ p.dashT-=dt; const ds=680;
    p.x=clamp(p.x+Math.cos(p.dashA)*ds*dt,p.r,AW-p.r); p.y=clamp(p.y+Math.sin(p.dashA)*ds*dt,p.r,AH-p.r);
    G.fx.push({type:'ghost',x:p.x,y:p.y,t:0,life:0.28,color:CHARS[p.cid].color}); onDashMove(dt); }
  else { p.x=clamp(p.x+mx*sp*dt,p.r,AW-p.r); p.y=clamp(p.y+my*sp*dt,p.r,AH-p.r); }
  pushOut(p);
  p.moving=Math.hypot(mx,my)>0.1; if(p.moving){ p.anim+=dt*11; }
  if(p.inv>0)p.inv-=dt; if(p.swingT>0)p.swingT-=dt; if(p.skillT>0)p.skillT-=dt;
  if(p.regen>0 && p.hp<p.maxHp){ p.hp=Math.min(p.maxHp,p.hp+p.regen*dt); }
  if(p.manaShield && p.shieldLeft<=0){ p.msT+=dt; if(p.msT>=10){ p.msT=0; p.shieldLeft=1; G.fx.push({type:'ring',x:p.x,y:p.y,r:34,t:0,life:0.4,color:'#7fb4ff'}); } }
  const c=CHARS[p.cid];
  const reach = c.attack==='melee' ? p.range*p.area+26 : p.range*(c.attack==='bolt'?1:1)*Math.sqrt(p.area);
  const tgt=nearestEnemy(p, reach, null, c.attack!=='melee');
  if(tgt) p.face=angTo(p,tgt); else if(p.moving) p.face=Math.atan2(my,mx);
  p.atkT-=dt;
  if(p.atkT<=0 && tgt && p.spin<=0){ attack(tgt); p.atkT=p.rate/p.atkSpd/(p.rage&&p.hp<p.maxHp*0.5?1.4:1); }
  // Wirbelwind
  if(p.spin>0){ p.spin-=dt; p.spinTick-=dt; p.face+=dt*18;
    if(p.spinTick<=0){ p.spinTick=0.16; const R=95*p.area; sfx('swing');
      for(const e of G.enemies){ if(Math.hypot(e.x-p.x,e.y-p.y)<R+e.r) dealDamage(e,p.dmg*0.65,{kb:140,from:p}); }
      G.fx.push({type:'ring',x:p.x,y:p.y,r:R,t:0,life:0.2,color:'#cfe3ff'}); } }
  // Feuerkugeln
  if(p.orbit>0){ G.orbitA+=dt*3.2; const R=62*Math.sqrt(p.area);
    for(let i=0;i<p.orbit;i++){ const a=G.orbitA+i*TAU/p.orbit, ox=p.x+Math.cos(a)*R, oy=p.y+Math.sin(a)*R;
      if(Math.random()<0.5) part(ox,oy,rand(-20,20),rand(-20,20),0.3,3,'#ff9a3a',true);
      for(const e of G.enemies){ if(e.orbCd<=0 && Math.hypot(e.x-ox,e.y-oy)<e.r+11){ e.orbCd=0.45; dealDamage(e,p.dmg*0.55,{kb:60,from:{x:ox,y:oy}}); if(hasSyn('inferno')) G.booms.push({x:ox,y:oy,r:44,dmg:p.dmg*0.45}); } } } }
}
function nearestEnemy(from,maxD,exclude,needLos){
  let best=null,bd=maxD;
  for(const e of G.enemies){ if(e.dead||e===exclude||(e.alpha!==undefined&&e.alpha<0.3)||e.under) continue; if(needLos && !los(from,e)) continue; const d=Math.hypot(e.x-from.x,e.y-from.y)-e.r; if(d<bd){bd=d;best=e;} }
  return best;
}

function attack(tgt){
  const p=P, c=CHARS[p.cid], a=angTo(p,tgt);
  p.atkCount++;
  if(c.attack==='melee'){
    const R=p.range*p.area+12, arc=2.2; p.swingT=0.18; sfx('swing');
    for(let i=0;i<p.count;i++){
      const ang=a+i*TAU/p.count;
      for(const e of G.enemies){ const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<R+e.r && Math.abs(angDiff(Math.atan2(e.y-p.y,e.x-p.x),ang))<arc/2+0.2) dealDamage(e,p.dmg,{kb:170,from:p}); }
      for(const o of G.obs){ if(o.type==='barrel' && Math.hypot(o.x-p.x,o.y-p.y)<R+o.r && Math.abs(angDiff(Math.atan2(o.y-p.y,o.x-p.x),ang))<arc/2+0.2) blowBarrel(o); }
      G.fx.push({type:'slash',x:p.x,y:p.y,a:ang,r:R,t:0,life:0.2,arc});
      if(p.wave>0) G.pproj.push({type:'wave',x:p.x+Math.cos(ang)*20,y:p.y+Math.sin(ang)*20,vx:Math.cos(ang)*430,vy:Math.sin(ang)*430,r:16*p.area,dmg:p.dmg*(0.3+0.15*p.wave),life:0.5,pierce:99,hit:new Set()});
    }
  } else if(c.attack==='bolt'){
    sfx('shoot');
    for(let i=0;i<p.count;i++){ const ang=a+(i-(p.count-1)/2)*0.32;
      G.pproj.push({type:'bolt',x:p.x+Math.cos(ang)*14,y:p.y+Math.sin(ang)*14-6,vx:Math.cos(ang)*360,vy:Math.sin(ang)*360,sp:360,r:7,dmg:p.dmg,life:1.6,target:tgt,aoe:34*p.area,pierce:0,split:p.split,hit:new Set()}); }
    if(p.meteor && p.atkCount%6===0) G.pstrikes.push({x:tgt.x,y:tgt.y,t:0,delay:0.55,r:80*p.area,dmg:p.dmg*3});
  } else {
    sfx('shoot');
    for(let i=0;i<p.count;i++){ const ang=a+(i-(p.count-1)/2)*0.14;
      G.pproj.push({type:'arrow',x:p.x,y:p.y-4,vx:Math.cos(ang)*640,vy:Math.sin(ang)*640,r:5,dmg:p.dmg,life:0.75*Math.sqrt(p.area)+0.25*p.bounce,pierce:p.pierce,bounce:p.bounce,poison:p.poison,hit:new Set()}); }
    if(p.volley && p.atkCount%4===0) for(let i=-2;i<=2;i++){ const ang=a+i*0.22; G.pproj.push({type:'arrow',x:p.x,y:p.y-4,vx:Math.cos(ang)*600,vy:Math.sin(ang)*600,r:5,dmg:p.dmg*0.8,life:0.7,pierce:p.pierce,bounce:p.bounce,poison:p.poison,hit:new Set(),gold:true}); }
  }
}

function useDash(){
  if(state!=='combat'||!P||!G||P.dashCd>0||P.dashT>0||G.over) return;
  const [mx,my]=readMove();
  P.dashA = Math.hypot(mx,my)>0.2 ? Math.atan2(my,mx) : P.face;
  P.dashT=0.2; P.dashI=0.32; P.dashCd=1.3*P.dashCdMul; P.dashHit=[];
  if(hasSyn('phantom')) P.nextCrit=true;
  sfx('dash'); burst(P.x,P.y+8,8,'#cfe3ff',90);
}
function onDashMove(dt){
  const p=P;
  if(p.dashDmg>0) for(const e of G.enemies){ if(!e.dead && !p.dashHit.includes(e) && Math.hypot(e.x-p.x,e.y-p.y)<p.r+e.r+8){ p.dashHit.push(e); dealDamage(e,p.dmg*p.dashDmg,{kb:340,from:p}); G.shake+=2; } }
  if(p.shadow>0){ p.trailT-=dt; if(p.trailT<=0){ p.trailT=0.05; G.pzones.push({x:p.x,y:p.y,r:24,life:1.4+0.5*p.shadow,max:1.4+0.5*p.shadow,dps:p.dmg*(0.5+0.3*p.shadow),tick:0}); } }
}
function hitstop(t){ if(!G) return; G.stop=Math.max(G.stop,t); }
function useSkill(){
  if(state!=='combat'||!P||P.skillT>0||G.over) return;
  const p=P, c=CHARS[p.cid]; p.skillT=c.skill.cd*p.cdMul; sfx('skill'); buzz(20);
  if(p.cid==='krieger'){ p.spin=1.5; p.spinTick=0; }
  else if(p.cid==='magier'){ const R=170*p.area;
    for(const e of G.enemies){ if(Math.hypot(e.x-p.x,e.y-p.y)<R+e.r){ dealDamage(e,p.dmg*2.2,{from:p,kb:120}); e.freeze=e.boss?0.7:2.4; } }
    G.fx.push({type:'ring',x:p.x,y:p.y,r:R,t:0,life:0.45,color:'#9fe6ff',fill:true}); burst(p.x,p.y,40,'#bdf2ff',320); G.shake+=5;
  } else { const n=24;
    for(let i=0;i<n;i++){ const a=i/n*TAU; G.pproj.push({type:'arrow',x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:5,dmg:p.dmg*1.6,life:0.9,pierce:3,bounce:p.bounce,poison:p.poison,hit:new Set(),gold:true}); }
    G.fx.push({type:'ring',x:p.x,y:p.y,r:60,t:0,life:0.25,color:'#e6ffb0'});
  }
}

function dealDamage(e,amount,o={}){
  if(e.dead||(e.boss&&e.alpha<0.3)) return;
  let crit=!o.noCrit && (P.nextCrit || Math.random()<P.crit); if(crit && P.nextCrit) P.nextCrit=false;
  if(P.rage && P.hp<P.maxHp*0.5) amount*=1.25;
  const d=amount*(crit?P.critMul:1)*rand(0.9,1.1);
  if(o.poison){ e.poisonT=3; e.poisonDps=Math.max(e.poisonDps||0, amount*o.poison/3); }
  if(crit && hasSyn('bladestorm')) P.atkT-=P.rate/P.atkSpd*0.25;
  e.hp-=d; e.flash=e.boss?0.04:0.09; sfx('hit');
  if(o.kb && !e.boss && o.from){ const a=Math.atan2(e.y-o.from.y,e.x-o.from.x), k=o.kb*(e.elite?0.4:1); e.kx+=Math.cos(a)*k; e.ky+=Math.sin(a)*k; }
  G.texts.push({x:e.x+rand(-6,6),y:e.y-e.r-4,s:String(Math.round(d)),c:o.color||(crit?'#ffd34d':'#ffffff'),big:crit,t:0});
  if(crit && G.stopCd<=0){ hitstop(0.03); G.stopCd=0.25; }
  if(!o.noChain && P.chain>0 && Math.random()<0.12+0.06*P.chain) chainLightning(e, amount*0.7, 2+P.chain);
  if(e.hp<=0) killEnemy(e);
}
function chainLightning(src,dmg,n){
  let cur=src; const hit=new Set([src]);
  for(let i=0;i<n;i++){
    let best=null,bd=170; for(const e of G.enemies){ if(e.dead||hit.has(e)) continue; const d=Math.hypot(e.x-cur.x,e.y-cur.y); if(d<bd){bd=d;best=e;} }
    if(!best) break; G.fx.push({type:'bolt',x:cur.x,y:cur.y,x2:best.x,y2:best.y,t:0,life:0.18}); hit.add(best);
    const nx=best.x, ny=best.y, cold=best.freeze>0||best.slow>0||(P.frost>0&&Math.hypot(P.x-nx,P.y-ny)<110+30*P.frost);
    dealDamage(best,dmg*(cold&&hasSyn('shatter')?2:1),{noChain:true,color:'#bfe6ff'}); cur={x:nx,y:ny};
  }
}
function explosion(x,y,r,dmg,color,fromBoom){
  G.fx.push({type:'ring',x,y,r,t:0,life:0.3,color,fill:true}); burst(x,y,16,color,200); sfx('boom'); G.shake+=2;
  for(const e of G.enemies){ if(!e.dead && Math.hypot(e.x-x,e.y-y)<r+e.r) dealDamage(e,dmg,{noChain:true,kb:120,from:{x,y}}); }
  for(const o of G.obs){ if(o.type==='barrel' && !o.dead && Math.hypot(o.x-x,o.y-y)<r+o.r) blowBarrel(o); }
}
function killEnemy(e){
  e.dead=true; sfx('kill'); if(e.elite) hitstop(0.09); if(e.boss) hitstop(0.35);
  burst(e.x,e.y,e.boss?80:12,enemyColor(e),e.boss?300:160);
  if(e.boss){ G.shake=20; buzz(200); for(let i=0;i<40;i++) dropCoin(e.x+rand(-40,40),e.y+rand(-40,40),2); run.souls+=25*run.act; run.bosses++;
    for(const o of G.enemies) if(!o.dead&&!o.boss){ o.dead=true; burst(o.x,o.y,8,enemyColor(o),120); }
    G.eproj=[]; G.hazards=[]; clearRoom(); return; }
  run.kills++; run.souls+=e.soul;
  const g=Math.max(1,Math.round(e.gold*rand(0.8,1.3)));

function updEnemy(e,dt){

    if(e.poisonAcc>=5||e.poisonT<=0){ const pa=e.poisonAcc; e.poisonAcc=0; if(e.poisonT<=0) e.poisonDps=0; dealDamage(e,pa,{noChain:true,noCrit:true,color:'#8dff6a'}); if(e.dead) return; }
    if(Math.random()<dt*6) part(e.x+rand(-0.6,0.6)*e.r,e.y-e.r*0.3,0,-30,0.5,3,'#8dff6a',true); }
  let sm=1; if(e.freeze>0){ e.freeze-=dt; sm=0; } else if(e.slow>0){ e.slow-=dt; sm=0.5; }

    case 'bat': { const w=Math.sin(e.t*4+e.seed)*1.1; mx=Math.cos(a+w); my=Math.sin(a+w); break; }
    case 'ranged': case 'caster': case 'imp': {

        else enemyShoot(e,a,240,e.dmg,'fire',7);
        if(e.elite && e.ai==='ranged'){ enemyShoot(e,a+0.2,210,e.dmg,'arrow',5); enemyShoot(e,a-0.2,210,e.dmg,'arrow',5); } }
      if(e.st>0) e.st-=dt;
      break; }
    case 'charger':
      if(e.st===0){ mx=Math.cos(a); my=Math.sin(a); e.timer-=dt*sm; if(e.timer<=0 && d<320){ e.st=1; e.stT=0.65; e.ca=a; } }
      else if(e.st===1){ e.stT-=dt*sm; e.face=e.ca; if(e.stT<=0){ e.st=2; e.stT=0.5; } }
      else { e.face=e.ca; mx=Math.cos(e.ca)*7.5; my=Math.sin(e.ca)*7.5; e.stT-=dt; if(Math.random()<0.6) part(e.x,e.y+e.r*0.6,rand(-20,20),rand(-20,20),0.4,4,'#8a7a6a');
        if(e.stT<=0||e.x<=e.r||e.x>=AW-e.r||e.y<=e.r||e.y>=AH-e.r){ e.st=0; e.timer=rand(2.8,4.2); } }
      break;
  }

  const kd=Math.min(1,dt*9);   e.kx-=e.kx*kd; e.ky-=e.ky*kd;

function separate(){
  const E=G.enemies;
  for(let i=0;i<E.length;i++) for(let j=i+1;j<E.length;j++){
    const a=E[i],b=E[j], dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
    if(d2<rr*rr && d2>0.01){ const d=Math.sqrt(d2), o=(rr-d)/2, nx=dx/d, ny=dy/d;
      const wa=a.boss?0:1, wb=b.boss?0:1, s=wa+wb||1;
      a.x-=nx*o*2*wa/s; a.y-=ny*o*2*wa/s; b.x+=nx*o*2*wb/s; b.y+=ny*o*2*wb/s; }
  }
}

function updProjectiles(dt){

    }

    if(pr.x<0||pr.y<0||pr.x>AW||pr.y>AH){
      if(pr.bounce>0){ pr.bounce--; if(pr.x<0||pr.x>AW) pr.vx=-pr.vx; if(pr.y<0||pr.y>AH) pr.vy=-pr.vy; pr.x=clamp(pr.x,0,AW); pr.y=clamp(pr.y,0,AH); pr.hit.clear(); pr.life=Math.max(pr.life,0.35); burst(pr.x,pr.y,4,'#ffe08a',80); }
      else pr.life=0; }

    { const o=solidHit(pr.x,pr.y,pr.r); if(o){ if(o.type==='barrel') blowBarrel(o);
        if(pr.type!=='wave'){ pr.life=0; burst(pr.x,pr.y,5,pr.type==='bolt'?'#c58cff':'#b8b0a0',90); continue; } } }
    for(const e of G.enemies){
