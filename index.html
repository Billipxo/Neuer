<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Reichsfeuer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&family=Uncial+Antiqua&family=UnifrakturCook:wght@700&family=Pirata+One&family=Germania+One&family=Metamorphous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Hauptmenü -->
  <div id="menu" class="hidden">
    <div class="embers" aria-hidden="true"><span style="left:4%;animation-duration:11s;animation-delay:0s"></span><span style="left:12%;animation-duration:14s;animation-delay:3s"></span><span style="left:21%;animation-duration:9s;animation-delay:6s"></span><span style="left:29%;animation-duration:13s;animation-delay:1s"></span><span style="left:37%;animation-duration:10s;animation-delay:8s"></span><span style="left:46%;animation-duration:15s;animation-delay:4s"></span><span style="left:54%;animation-duration:12s;animation-delay:2s"></span><span style="left:62%;animation-duration:9s;animation-delay:7s"></span><span style="left:70%;animation-duration:14s;animation-delay:5s"></span><span style="left:78%;animation-duration:11s;animation-delay:9s"></span><span style="left:86%;animation-duration:13s;animation-delay:1.5s"></span><span style="left:94%;animation-duration:10s;animation-delay:6.5s"></span></div>
    <header class="title">
      <h1>Reichsfeuer</h1>
      <div class="orn" id="title-orn"></div>
      <p>Baue deine Festung, führe deinen Helden und zerschmettere die feindlichen Völker.</p>
    </header>
    <div id="menu-body"></div>
  </div>

  <!-- Spiel -->
  <div id="game" class="hidden">
    <div id="top">
      <div id="top-res"></div>
      <div class="top-ctrl">
        <button data-act="centerbase" title="Kamera auf Basis">⌂ Basis</button>
        <button data-act="centerhero" title="Kamera auf Held (Leertaste)">♛ Held</button>
        <button data-act="zoom" data-v="1.2" title="Hineinzoomen (+)">＋</button>
        <button data-act="zoom" data-v="0.8333" title="Herauszoomen (−)">－</button>
        <button data-act="mute" title="Ton an/aus">🔊</button>
        <button data-act="pause" title="Pause (P)">❚❚</button>
        <button data-act="speed" data-v="1">1×</button>
        <button data-act="speed" data-v="2">2×</button>
        <button data-act="speed" data-v="4">4×</button>
        <button data-act="saveui" title="Spiel speichern / laden">💾</button>
        <button data-act="quit" title="Zum Hauptmenü (wird automatisch gesichert)">✕</button>
      </div>
    </div>
    <div id="main">
      <div id="viewwrap">
        <canvas id="view"></canvas>
        <div id="msgs"></div>
        <div id="selection" class="hidden"></div>
        <div id="mmwrap"><canvas id="minimap"></canvas></div>
        <button id="paneltoggle" data-act="panel" title="Menü öffnen">☰</button>
        <div id="quick"></div>
        <div id="herocard"></div>
        <div id="tutorial" class="hidden"></div>
        <div id="keys">WASD/Pfeile: Kamera · Ziehen: Karte verschieben · Mausrad: Zoom · +/−: Zoom · H: Held manuell · Q/E/R: Heldenfähigkeiten · 1/2/3: Volksfähigkeiten · Esc: Abbrechen</div>
      </div>
      <aside id="panel">
        <div id="panelhead"></div>
        <div id="race-ab"></div>
        <nav id="tabs"></nav>
        <div id="tab-body"></div>
      </aside>
    </div>
    <div id="saveui" class="hidden"><div id="saveui-body" class="framed"></div></div>
  </div>

  <!-- Spielende -->
  <div id="end" class="hidden"><div id="end-body"></div></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/save.js"></script>
  <script src="js/render.js"></script>
  <script src="js/landschaft.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
